<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RedCheck · Denní přehled</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0OCA0OCI+PHJlY3Qgd2lkdGg9IjQ4IiBoZWlnaHQ9IjQ4IiByeD0iNyIgZmlsbD0iI2E3MzIyNSIvPjxwYXRoIGQ9Ik0xMSAxM2gxNU0xMSAyMGgxMU0xMSAyN2g4IiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iMyIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PHBhdGggZD0ibTI0IDI4IDQuNSA0LjVMMzggMjIiIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLXdpZHRoPSIzLjUiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIvPjwvc3ZnPg=="><script>if(window.self!==window.top)document.documentElement.classList.add("embedded-view");</script><script src="appearance.js"></script><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#0d1220;color:#e8edf7}
*{box-sizing:border-box}body{margin:0}main{max-width:1090px;margin:0 auto;padding:18px}
header{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:1.25rem;margin:0}h2{font-size:1.05rem;margin:0 0 12px}a{color:#80c7ff}
.page-identity,.brand-link{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brand-link{text-decoration:none}.brand-mark{width:28px;height:28px;flex:none}.brand-mark rect{fill:var(--ui-accent)}.brand-mark path{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.card{background:#171f30;border:1px solid #334059;border-radius:13px;padding:18px;margin-bottom:14px}
.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
label{display:grid;gap:5px;color:#c6d3e6}button,input,select{font:inherit;border:1px solid #475672;border-radius:8px;padding:9px 11px}
input,select{background:#0e1626;color:#fff}button{background:#2851a5;color:white;cursor:pointer}button.secondary{background:#263348}button:disabled{opacity:.6;cursor:wait}
#generate{display:inline-flex;align-items:center;gap:9px}
.spinner{display:inline-block;width:17px;height:17px;border:2px solid #aac5ef;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
.spinner[hidden]{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
aside{color:#b4c3da;font-size:.87rem;margin-top:9px}#message{min-height:1.4em}
.layout{display:grid;grid-template-columns:215px minmax(0,1fr);gap:14px}
#history{display:flex;flex-direction:column;gap:6px}#history button{text-align:left;background:#24334a}
#history button[aria-current=true]{background:#2851a5}#report{line-height:1.65;overflow-wrap:anywhere}
#report h2{margin-top:22px;padding-bottom:5px;border-bottom:1px solid #344258}
#report ul{padding-left:23px}#report li{margin-bottom:9px}
.today-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.today-head h2{margin:0}.today-meta{color:var(--ui-muted);margin:10px 0}.today-item{padding:12px 0;border-top:1px solid var(--ui-border);overflow-wrap:anywhere}.today-item h3{font-size:1rem;margin:0 0 5px}.today-item p{margin:6px 0;line-height:1.5}.today-item ul{padding-left:20px;margin:8px 0}.today-item li{margin:5px 0}.today-status{color:var(--ui-muted)}
@media(max-width:700px){.layout{grid-template-columns:1fr}#history{flex-direction:row;overflow-x:auto}}
</style><link rel="stylesheet" href="appearance.css"></head><body class="digest-page">
<main><header><h1 class="page-identity"><a class="brand-link" href="./" aria-label="RedCheck – zpět na přehled"><svg class="brand-mark" aria-hidden="true" viewBox="0 0 48 48"><rect width="48" height="48" rx="7"/><path d="M11 13h15M11 20h11M11 27h8"/><path class="brand-check" d="m24 28 4.5 4.5L38 22"/></svg><span>Red<span class="brand-accent">Check</span></span></a><span class="page-title">Denní přehled firmy</span></h1><a id="back" href=".">Zpět na úkoly</a></header>
<section class="card" aria-labelledby="today-title"><div class="today-head"><h2 id="today-title">Co se dnes stalo</h2><button id="refresh-today" type="button">Obnovit dnešek</button></div><p id="today-status" class="today-meta" role="status">Načítám dnešní změny…</p><div id="today-list"></div></section>
<section class="card"><h2>Nastavení denního souhrnu</h2>
<div class="controls"><label>Čas generování (Praha)<input id="digest-time" type="time" value="17:30"></label>
<button id="save">Uložit čas</button><button id="generate" class="secondary"><span class="spinner" id="digest-spinner" hidden aria-hidden="true"></span><span>Vygenerovat teď</span></button></div>
<aside id="next">Načítám plán…</aside><p id="message" role="status"></p></section>
<section class="layout"><section class="card"><h2>Historie reportů</h2><div id="history">Načítám…</div></section>
<article class="card" id="report"><h2>Vyber den z historie</h2></article></section>
</main><script>
const prefix=location.pathname.startsWith('/redmine/')?'/redmine':'';
document.querySelector('#back').href=prefix?prefix+'/':'.';
const api=(p,o)=>fetch(prefix+p,o);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const announce=s=>$('#message').textContent=s;
const todayTime=value=>new Date(value).toLocaleTimeString('cs-CZ',{timeZone:'Europe/Prague',hour:'2-digit',minute:'2-digit'});
async function loadToday(){
 const button=$('#refresh-today'), status=$('#today-status'), list=$('#today-list');
 button.disabled=true;list.replaceChildren();status.textContent='Načítám dnešní změny z Redmine…';
 try{
  const response=await api('/api/digest/today');const data=await response.json();
  if(!response.ok)throw Error(data.error||'Dnešní změny se nepodařilo načíst.');
  const date=new Date(data.checked_at).toLocaleDateString('cs-CZ',{timeZone:'Europe/Prague',dateStyle:'long'});
  status.textContent=date+' · od 00:00 do '+todayTime(data.checked_at)+' · dotčené požadavky: '+data.items.length+' · všechny dostupné projekty včetně uzavřených';
  if(!data.items.length){const p=document.createElement('p');p.textContent='Dnes zatím nejsou v dostupných projektech zaznamenány změny úkolů.';list.append(p);return}
  for(const item of data.items){
   const entry=document.createElement('article');entry.className='today-item';
   const title=document.createElement('h3'), link=document.createElement('a'), url=new URL(item.url);
   if(!['http:','https:'].includes(url.protocol))throw Error('Neplatný odkaz na požadavek.');
   link.href=url.href;link.target='_blank';link.rel='noopener noreferrer';link.textContent='#'+item.id+' · '+item.subject;title.append(link);entry.append(title);
   const meta=document.createElement('p');meta.className='today-status';meta.textContent=item.project+' · aktuální stav: '+item.status;entry.append(meta);
   if(item.created_at){const p=document.createElement('p');p.textContent=todayTime(item.created_at)+' · '+(item.author||'Neznámý autor')+' · nový požadavek'+(item.description?' — '+item.description:'');entry.append(p)}
   if(item.changes.length){const changes=document.createElement('ul');for(const change of item.changes){const li=document.createElement('li');li.textContent=todayTime(change.at)+' · '+(change.author||'Neznámý autor')+' · '+(change.labels.join(', ')||'komentář')+(change.note?' — '+change.note:'');changes.append(li)}entry.append(changes)}
   list.append(entry);
  }
 }catch(error){list.replaceChildren();status.textContent=error.message||'Dnešní změny se nepodařilo načíst. Zkuste obnovit.'}
 finally{button.disabled=false}
}
$('#refresh-today').onclick=loadToday;
function renderMd(md){
 const lines=md.split(/\r?\n/);let inside=false;const rendered=[];
 const links=line=>esc(line).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>'<a target="_blank" rel="noopener noreferrer" href="'+url+'">'+label+'</a>');
 for(const line of lines){
  if(line.startsWith('- ')){if(!inside){rendered.push('<ul>');inside=true}rendered.push('<li>'+links(line.slice(2))+'</li>');continue}
  if(inside){rendered.push('</ul>');inside=false}
  if(line.startsWith('# '))rendered.push('<h2>'+links(line.slice(2))+'</h2>');
  else if(line.startsWith('## '))rendered.push('<h2>'+links(line.slice(3))+'</h2>');
  else if(line.trim())rendered.push('<p>'+links(line)+'</p>');
 }
 if(inside)rendered.push('</ul>');
 $('#report').innerHTML=rendered.join('');
}
async function loadSettings(){
 const r=await api('/api/digest/settings');if(!r.ok)throw Error('Nastavení není dostupné');
 const d=await r.json();$('#digest-time').value=d.time;
 $('#next').textContent='Další plánovaný souhrn: '+new Date(d.next_run).toLocaleString('cs-CZ',{dateStyle:'medium',timeStyle:'short'})+' (Europe/Prague)';
 if(d.error)announce('Poslední chyba generování: '+d.error);
}
async function openDay(day){
 const r=await api('/api/digest/report?day='+encodeURIComponent(day));
 const d=await r.json();if(!r.ok)throw Error(d.error||'Report nelze načíst');
 renderMd(d.markdown);
 document.querySelectorAll('[data-day]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.day===day)));
}
async function loadHistory(selected){
 const r=await api('/api/digest/history');if(!r.ok)throw Error('Historie není dostupná');
 const {reports}=await r.json();const list=$('#history');list.replaceChildren();
 if(!reports.length){list.textContent='Zatím žádné reporty.';return}
 for(const row of reports){const button=document.createElement('button');button.dataset.day=row.day;button.textContent=row.day+' · '+row.events+' událostí';button.onclick=()=>openDay(row.day).catch(e=>announce(e.message));list.append(button)}
 await openDay(selected||reports[0].day);
}
$('#save').onclick=async()=>{const b=$('#save');b.disabled=true;try{
 const r=await api('/api/digest/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({time:$('#digest-time').value})});
 const d=await r.json();if(!r.ok)throw Error(d.error);await loadSettings();announce('Čas reportu byl uložen.')
}catch(e){announce('Uložení selhalo: '+e.message)}finally{b.disabled=false}};
async function awaitReport(){
 for(;;){
  await new Promise(resolve=>setTimeout(resolve,1500));
  const response=await api('/api/digest/job');
  if(!response.ok)throw Error('Stav generování není dostupný');
  const job=await response.json();
  if(job.state==='error')throw Error(job.error||'Generování selhalo');
  if(job.state==='done')return job.result;
 }
}
async function showCompletedReport(){
 const result=await awaitReport();
 await loadHistory(result.day);await loadSettings();
 announce('Report '+result.day+' uložen ('+result.event_count+' událostí).');
}
$('#generate').onclick=async()=>{
 const b=$('#generate');b.disabled=true;$('#digest-spinner').hidden=false;
 announce('Generování běží na serveru, prohlížeč nemusí zůstat otevřený…');
 try{
  const r=await api('/api/digest/generate',{method:'POST'});const d=await r.json();
  if(!r.ok)throw Error(d.error||'Server už generuje jiný report');
  await showCompletedReport();
 }catch(e){announce('Generování selhalo: '+e.message)}
 finally{b.disabled=false;$('#digest-spinner').hidden=true}
};
async function restoreRunningJob(){
 const response=await api('/api/digest/job');
 if(!response.ok)return;
 const job=await response.json();
 if(job.state!=='running')return;
 const button=$('#generate');
 button.disabled=true;$('#digest-spinner').hidden=false;
 announce('Generování stále běží na serveru…');
 try{await showCompletedReport()}
 catch(err){announce('Generování selhalo: '+err.message)}
 finally{button.disabled=false;$('#digest-spinner').hidden=true}
}
loadToday();
Promise.all([loadSettings(),loadHistory(),restoreRunningJob()]).catch(e=>announce(e.message));
</script></body></html>
