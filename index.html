<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redmine · Přehled</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e9edf4;background:#101722;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #344255;background:#182333}header div,main{max-width:1180px;margin:auto;padding:22px 28px}header div{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 16px}p{line-height:1.5;color:#b5c4d5}.sub{margin:5px 0 0;font-size:14px}button{font:inherit;background:#294966;color:#fff;border:1px solid #4f7598;border-radius:8px;padding:10px 14px;cursor:pointer}button:hover{background:#365d80}button:focus-visible,a:focus-visible{outline:3px solid #82c9fc;outline-offset:2px}button:disabled{opacity:.6}main{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}.nav{display:flex;flex-direction:column;gap:8px}.map-link{display:block;padding:10px 14px;color:#a5d9fc;text-decoration:none}.nav button{text-align:left;background:transparent;border-color:transparent}.nav button[aria-current=true]{background:#263c51;border-color:#3d5f79}.panel{min-width:0}.status{padding:12px 15px;background:#202f40;border-radius:8px;margin-bottom:20px;color:#c6d8e9}.issue{padding:17px 0;border-bottom:1px solid #354253;display:grid;grid-template-columns:1fr auto;gap:8px}.issue h3{font-size:16px;margin:0 0 7px}.issue p{font-size:14px;margin:5px 0}.issue a{color:#90d4ff;text-decoration:none}.tag{color:#ffd18b}.issue button{align-self:start}.summary{white-space:pre-wrap;grid-column:1/-1;background:#202f40;padding:12px;border-radius:8px;color:#e9edf4}.empty{padding:25px 0}.error{color:#ffc0b9}@media(max-width:700px){header div,main{padding:18px}main{display:block}.nav{flex-direction:row;overflow:auto;margin-bottom:24px}.nav button{white-space:nowrap}.issue{grid-template-columns:1fr}.issue button{justify-self:start}}

button{min-height:44px}.issue{overflow-wrap:anywhere}.map-link{min-height:44px}.nav button[aria-current=true]{font-weight:700}.map-link:focus-visible{outline:3px solid #82c9fc;outline-offset:2px}@media(max-width:700px){.nav{flex-wrap:wrap;overflow:visible}.nav button,.map-link{flex:1 1 auto;text-align:center}.issue button{width:100%}}
</style></head><body><header><div><section><h1>Redmine přehled</h1><p class="sub">Úkoly a helpdesk na jednom místě</p></section><button id="sync">Obnovit</button></div></header><main><nav class="nav" aria-label="Přehled"><button data-view="new" aria-current="true">Nové a změněné</button><button data-view="mine">Moje úkoly</button><button data-view="helpdesk">Helpdesk</button><a class="map-link" href="mapa">Mapa zákazníků</a></nav><section class="panel"><div id="status" class="status" role="status">Načítám přehled…</div><h2 id="title">Nové a změněné</h2><div id="list"></div></section></main>
<script>
const appPath=location.pathname.startsWith('/redmine/')?'/redmine':'';
const apiFetch=(path,options)=>fetch(appPath+path,options);
let data, view='new';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>s?new Date(s).toLocaleString('cs-CZ'):'—';
function render(){let events=new Map();for(const e of data.events)if(!events.has(e.issue_id))events.set(e.issue_id,e);let list=data.issues.filter(i=>view==='mine'?i.mine:view==='helpdesk'?i.project?.name?.toLowerCase().includes('helpdesk'):events.has(i.id));$('#title').textContent=({new:'Nové a změněné',mine:'Moje úkoly',helpdesk:'Helpdesk'})[view];$('#status').textContent= data.error?'Synchronizace: '+data.error: data.last_sync?'Poslední synchronizace: '+date(data.last_sync):'Zatím bez synchronizace. Nastavte API klíč.';$('#list').innerHTML=list.length?list.map(i=>`<article class="issue"><div><h3><a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${i.id}">#${i.id} ${esc(i.subject)}</a></h3><p>${esc(i.status?.name)} · ${esc(i.assigned_to?.name||'Nepřiřazeno')} · ${date(i.updated_on)}</p>${view==='new'?`<p>${events.get(i.id)?.kind==='new'?'Nový požadavek':'Změněný požadavek'} · zachyceno ${date(events.get(i.id)?.seen_at)}</p>`:''}${i.hardware_reasons.length?`<p class="tag">Možný hardware: ${esc(i.hardware_reasons.join(', '))}</p>`:''}</div><button data-summary="${i.id}" ${data.ai_configured?'':'disabled'} title="${data.ai_configured?'':'Lokální AI není nastavena'}">Shrnout pomocí AI</button><div id="summary-${i.id}" hidden class="summary"></div></article>`).join(''):'<p class="empty">Žádné položky k zobrazení. Při prvním načtení se stávající požadavky neoznačují jako nové.</p>'}
async function load(){const r=await apiFetch('/api/overview');data=await r.json();render()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-current',String(x===b)));render()});$('#sync').onclick=async()=>{let b=$('#sync');b.disabled=true;$('#status').textContent='Synchronizuji…';try{let r=await apiFetch('/api/sync',{method:'POST'}),v=await r.json();await load();if(!r.ok)$('#status').textContent='Synchronizace selhala: '+v.error}catch(e){$('#status').textContent='Synchronizace selhala: '+e.message}finally{b.disabled=false}};$('#list').onclick=async e=>{let b=e.target.closest('[data-summary]');if(!b)return;let d=$('#summary-'+b.dataset.summary);d.hidden=false;d.textContent='Připravuji shrnutí…';b.disabled=true;try{let r=await apiFetch('/api/summary/'+b.dataset.summary,{method:'POST'}),v=await r.json();d.textContent=r.ok?v.summary:'Shrnutí se nezdařilo: '+v.error}catch(err){d.textContent='Shrnutí se nezdařilo: '+err.message}finally{b.disabled=false}};load().catch(e=>$('#status').textContent='Přehled se nepodařilo načíst: '+e.message);
</script></body></html>
