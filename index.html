 if(filters.assignee&&filters.assignee!=='unassigned'&&!assignees.some(x=>x[0]===filters.assignee))assignees.push([filters.assignee,'Dříve vybraný řešitel']);
 const set=(id,kind,choices)=>{$('#'+id).innerHTML=choices.map(([value,label])=>`<button type="button" class="filter-chip" data-filter="${kind}" data-value="${esc(value)}" aria-pressed="${String(filters[kind]===value)}">${esc(label)}</button>`).join('')};
 set('filter-status','status',[['','Všechny'],...statuses.map(x=>[x,x])]);
 set('filter-assignee','assignee',[['','Všichni'],['unassigned','Nepřiřazeno'],...assignees]);
 set('filter-type','type',[['','Všechny'],['hardware','Možný hardware'],['unmarked','Bez označení hardware']]);
 set('filter-age','age',[['','Vše'],['day','Do 24 hodin'],['three','1–3 dny'],['old','3 dny a více']]);
}
function render(){const v=data.version;$('#app-version').textContent=v?`Verze ${v.number} · sestavení ${v.build}`:'Verze není dostupná';let events=new Map();for(const e of data.events)if(!events.has(e.issue_id))events.set(e.issue_id,e);const isHelpdesk=i=>i.project?.id===12;const isOld=i=>Number.isFinite(Date.parse(i.created_on))&&Date.now()-Date.parse(i.created_on)>=72*3600000&&!/vyřešen|uzavřen|zavřen|resolved|closed/i.test(i.status?.name||'');$('#count-new').textContent=data.issues.filter(i=>events.has(i.id)).length;$('#count-mine').textContent=data.issues.filter(i=>i.mine).length;$('#count-helpdesk').textContent=data.issues.filter(isHelpdesk).length;$('#count-triage').textContent=data.issues.filter(i=>isHelpdesk(i)&&['auto_candidate','review'].includes(i.triage?.action)).length;$('#count-old').textContent=data.issues.filter(isOld).length;updateFilters();let list=data.issues.filter(i=>view==='mine'?i.mine:view==='helpdesk'?isHelpdesk(i):view==='triage'?isHelpdesk(i)&&['auto_candidate','review'].includes(i.triage?.action):view==='old'?isOld(i):events.has(i.id));if(filters.status)list=list.filter(i=>i.status?.name===filters.status);if(filters.assignee)list=list.filter(i=>filters.assignee==='unassigned'?i.assigned_to?.id==null:String(i.assigned_to?.id)===filters.assignee);if(filters.age)list=list.filter(i=>{const created=Date.parse(i.created_on),hours=(Date.now()-created)/3600000;return Number.isFinite(created)&&hours>=0&&(filters.age==='day'?hours<24:filters.age==='three'?hours>=24&&hours<72:hours>=72)});const cq=$('#filter-customer').value.trim().toLocaleLowerCase('cs');if(cq)list=list.filter(i=>{const names=i.customers?.length?i.customers.map(c=>c.name):i.customer_suggestions?.slice(0,1).map(c=>c.name)||[];return names.some(name=>String(name||'').toLocaleLowerCase('cs').includes(cq))});if(filters.type)list=list.filter(i=>filters.type==='hardware'?Boolean(i.hardware_reasons?.length):!i.hardware_reasons?.length);const q=$('#search').value.trim().toLocaleLowerCase('cs');if(q)list=list.filter(i=>[i.id,i.subject,i.status?.name,i.assigned_to?.name,...(i.customers||[]).map(c=>c.name),...(i.customer_suggestions||[]).map(c=>c.name)].join(' ').toLocaleLowerCase('cs').includes(q));$('#results').textContent=`Zobrazeno: ${list.length}`;$('#title').textContent=({new:'Nové a změněné',mine:'Moje úkoly',helpdesk:'Helpdesk',triage:'HW návrhy',old:'Dlouho otevřené'})[view];$('#status').textContent= data.error?'Synchronizace: '+data.error: data.last_sync?'Poslední synchronizace: '+date(data.last_sync):'Zatím bez synchronizace. Nastavte API klíč.';$('#list').innerHTML=list.length?list.map(i=>renderIssue(i,events)).join(''):'<p class="empty">Žádné položky k zobrazení.</p>'}
function renderIssue(i,events){
 const status=(i.status?.name||'').trim().toLocaleLowerCase('cs');
 const created=Date.parse(i.created_on), elapsed=Date.now()-created;
 const resolved=status==='vyřešený';
 const fresh=status==='nový'&&Number.isFinite(created)&&elapsed>=0&&elapsed<72*3600000;
 const cardClass=resolved?'issue-resolved':fresh?'issue-fresh':'';
 const badge=resolved?'status-resolved':({Nový:'status-new',Vrácený:'status-returned',Probíhá:'status-progress'})[i.status?.name]||'';
 const url=`${esc(data.base_url)}/issues/${i.id}`,suggestion=i.customer_suggestions?.[0];
 const customer=i.customers?.length?`<span class="customer-label">Provozovna</span> ${i.customers.map(c=>`<a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${c.id}">${esc(c.name)}</a>`).join(', ')}`:suggestion?`<span class="customer-label">Návrh provozovny</span> <a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${suggestion.id}">${esc(suggestion.name)}</a> <span class="badge unverified">Neověřeno</span>${i.customer_suggestions.length>1?' <span class="customer-label">Další možnosti v návrzích</span>':''}`:'<span class="customer-label">Provozovna nebyla ověřena</span>';
 const meta=[`<span class="age ${age(i.created_on).cls}">${age(i.created_on).text}</span>`,`<span>přijato ${date(i.created_on)}</span>`,`<span>aktualizováno ${date(i.updated_on)}</span>`,`<span>${esc(i.assigned_to?.name||'Nepřiřazeno')}</span>`];
 if(view==='new')meta.push(`<span>${events.get(i.id)?.kind==='new'?'Nový požadavek':'Změněný požadavek'} · zachyceno ${date(events.get(i.id)?.seen_at)}</span>`);
 if(i.triage?.action==='auto_candidate'||i.triage?.action==='review')meta.push(`<span>${i.triage.action==='auto_candidate'?'HW kandidát k přiřazení (zatím bez automatiky)':'HW vyžaduje posouzení'}: ${esc(i.triage.reason)}</span>`);
 if(i.hardware_reasons?.length)meta.push(`<span>Možný hardware: ${esc(i.hardware_reasons.join(', '))}</span>`);
 return `<article class="issue ${cardClass}"><div><div class="issue-heading"><a class="issue-id" target="_blank" rel="noopener noreferrer" href="${url}">#${i.id}</a><h3><a target="_blank" rel="noopener noreferrer" href="${url}">${esc(i.subject)}</a></h3><span class="badge ${badge}">${esc(i.status?.name||'Neznámý stav')}</span></div><div class="customer-box"><div class="customer-title">${customer}</div>${!i.customers?.length&&suggestion?`<p class="customer-reason">${esc(suggestion.reason)}</p>`:''}</div><div class="meta">${meta.join('')}</div></div><div class="issue-actions"><button class="secondary-action" data-brief="${i.id}" aria-haspopup="dialog" aria-controls="brief-dialog">Stručný přehled</button><button class="secondary-action" data-close-issue="${i.id}">Uzavřít požadavek</button>${i.project?.id===12?`<button class="primary-action" data-advice="${i.id}">Návrhy přiřazení</button>`:''}<button class="secondary-action" data-summary="${i.id}" ${data.ai_configured?'':'disabled'} title="${data.ai_configured?'':'Lokální AI není nastavena'}"><span aria-hidden="true">✦</span> Shrnout pomocí AI</button></div>${i.project?.id===12?`<section id="advice-${i.id}" class="advice" hidden aria-live="polite"></section>`:''}<div id="summary-${i.id}" hidden class="summary" role="status"></div></article>`
}
function showAdvice(id,v){const el=$('#advice-'+id);adviceById.set(id,v);const cs=v.customer_candidates.filter(c=>!v.linked_customers.some(x=>x.id===c.id));el.innerHTML=`<p><strong>Návrh provozovny</strong></p>${v.linked_customers.length?`<p>Již propojeno: ${v.linked_customers.map(c=>esc(c.name)).join(', ')}</p>`:''}${cs.length?cs.map(c=>`<p>${esc(c.name)} · ${esc(c.reason)} <button data-apply-customer="${c.id}" data-issue="${id}">Propojit zákazníka</button></p>`).join(''):'<p>Žádná použitelná shoda v textu. Ověř požadavek ručně.</p>'}<p><strong>Návrh řešitele</strong></p><p>${v.assignee_suggestion?`${esc(v.assignee_suggestion.name)} · ${esc(v.assignee_suggestion.reason)}; ověř, zda jde skutečně o hardware.`:'Podle obsahu nelze řešitele bezpečně navrhnout.'}</p><label for="member-${id}">Vybrat řešitele</label><select id="member-${id}"><option value="">Vyber osobu</option>${v.members.map(m=>`<option value="${m.id}" ${v.assignee_suggestion?.id===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select> <button data-apply-assignee="${id}">Přiřadit osobu</button><p id="advice-result-${id}" role="status"></p>`}
document.querySelector('#list').addEventListener('click',async e=>{const button=e.target.closest('[data-advice], [data-apply-customer], [data-apply-assignee]');if(!button)return;const id=Number(button.dataset.advice||button.dataset.issue||button.dataset.applyAssignee);if(button.dataset.advice){const panel=$('#advice-'+id);panel.hidden=false;panel.dataset.adviceOpen='true';panel.textContent='Načítám návrhy z místních dat a Redmine…';button.disabled=true;try{const r=await apiFetch('/api/helpdesk-suggestions/'+id,{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);showAdvice(id,v)}catch(err){panel.textContent='Návrhy se nepodařilo načíst: '+err.message}finally{button.disabled=false}return}const v=adviceById.get(id);if(!v)return;const action=button.dataset.applyCustomer?'customer':'assignee';const target=Number(action==='customer'?button.dataset.applyCustomer:$('#member-'+id).value);const choice=action==='customer'?v.customer_candidates.find(c=>c.id===target):v.members.find(m=>m.id===target);if(!choice){$('#advice-result-'+id).textContent='Nejdřív vyber položku.';return}if(!window.confirm(action==='customer'?`Propojit zákazníka „${choice.name}“ s požadavkem #${id} v Redmine?`:`Změnit řešitele požadavku #${id} z „${v.assigned_to?.name||'Nepřiřazeno'}“ na „${choice.name}“ v Redmine?`))return;button.disabled=true;const result=$('#advice-result-'+id);result.textContent='Odesílám změnu…';try{const r=await apiFetch('/api/helpdesk-apply/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,target,updated_on:v.updated_on,state_token:v.state_token})}),body=await r.json();if(!r.ok)throw Error(body.error);result.textContent='Změna je ověřena v Redmine. Před další změnou načti návrhy znovu.';adviceById.delete(id);$('#advice-'+id).querySelectorAll('[data-apply-customer],[data-apply-assignee]').forEach(b=>b.disabled=true)}catch(err){result.textContent='Změnu nelze potvrdit: '+err.message}finally{if(adviceById.has(id))button.disabled=false}});
document.querySelector('#list').addEventListener('click',e=>{
 const button=e.target.closest('[data-brief]');if(!button||!data)return;
 const id=Number(button.dataset.brief), issue=data.issues.find(i=>i.id===id), panel=$('#brief-content');if(!issue||!panel)return;
 const description=String(issue.description||'').trim();
 const excerpt=description.length>600?description.slice(0,600).trimEnd()+'…':description;
 const customers=(issue.customers||[]).map(c=>c.name).filter(Boolean);
 const customer=customers.length?customers.join(', '):issue.customer_suggestions?.length?issue.customer_suggestions[0].name:'Není ověřena';
 const customerLabel=customers.length?'Provozovna':issue.customer_suggestions?.length?'Návrh provozovny · neověřeno':'Provozovna';
 panel.innerHTML=`<dl class="brief-facts"><div><dt>Požadavek</dt><dd>${esc(issue.subject||'Bez předmětu')}</dd></div><div><dt>Stav</dt><dd>${esc(issue.status?.name||'Neznámý')}</dd></div><div><dt>Přiřazeno</dt><dd>${esc(issue.assigned_to?.name||'Nepřiřazeno')}</dd></div><div><dt>${customerLabel}</dt><dd>${esc(customer)}</dd></div></dl><section class="brief-description"><h3>Popis${description.length>600?' · zkrácený':''}</h3><p>${esc(excerpt||'Není k dispozici.')}</p></section>${!customers.length&&issue.customer_suggestions?.length&&issue.project?.id===12?`<button type="button" data-brief-advice="${id}">Prověřit návrhy provozovny</button>`:''}`;
 $('#brief-dialog').showModal();
});
$('#brief-close').addEventListener('click',()=>$('#brief-dialog').close());
$('#brief-content').addEventListener('click',e=>{const button=e.target.closest('[data-brief-advice]');if(!button)return;const id=button.dataset.briefAdvice;$('#brief-dialog').close();const target=document.querySelector(`[data-advice="${id}"]`);if(target){target.click();target.focus()}});
let closingIssue=false;
document.querySelector('#list').addEventListener('click',async e=>{const button=e.target.closest('[data-close-issue]');if(!button||closingIssue)return;const id=Number(button.dataset.closeIssue),issue=data.issues.find(i=>i.id===id);if(!issue)return;if(!window.confirm(`Uzavřít požadavek #${id} „${issue.subject||'Bez předmětu'}“ v Redmine?`))return;closingIssue=true;button.disabled=true;button.textContent='Uzavírám…';try{const response=await apiFetch('/api/close-issue/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({updated_on:issue.updated_on})}),body=await response.json();if(!response.ok)throw Error(body.error||'Uzavření se nezdařilo.');data.issues=data.issues.filter(i=>i.id!==id);render();$('#status').textContent=`Požadavek #${id} byl uzavřen v Redmine.`}catch(err){button.disabled=false;button.textContent='Uzavřít požadavek';$('#status').textContent='Uzavření se nepodařilo potvrdit: '+err.message}finally{closingIssue=false}});

document.querySelector('.filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b||!data)return;filters[b.dataset.filter]=b.dataset.value;render();const buttons=document.querySelectorAll('[data-filter]');for(const item of buttons)if(item.dataset.filter===b.dataset.filter&&item.dataset.value===b.dataset.value){item.focus();break}});$('#filter-reset').addEventListener('click',()=>{filters.status='';filters.assignee='';filters.age='';filters.type='';$('#filter-customer').value='';$('#search').value='';if(data)render()});$('#filter-customer').addEventListener('input',()=>{if(data)render()});$('#search').addEventListener('input',()=>{if(data)render()});async function load(){const r=await apiFetch('/api/overview');data=await r.json();render()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-current',String(x===b)));render()});$('#sync').onclick=async()=>{let b=$('#sync');b.disabled=true;b.textContent='Načítám…';$('#status').textContent='Načítám aktuální úkoly z Redmine…';try{let r=await apiFetch('/api/sync',{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error||'Server odmítl synchronizaci');await load()}catch(e){$('#status').textContent='Načtení z Redmine selhalo: '+e.message}finally{b.disabled=false;b.textContent='Načíst z Redmine'}};$('#list').onclick=async e=>{let b=e.target.closest('[data-summary]');if(!b)return;let d=$('#summary-'+b.dataset.summary);d.hidden=false;d.textContent='Připravuji shrnutí…';b.disabled=true;try{let r=await apiFetch('/api/summary/'+b.dataset.summary,{method:'POST'}),v=await r.json();d.textContent=r.ok?v.summary:'Shrnutí se nezdařilo: '+v.error}catch(err){d.textContent='Shrnutí se nezdařilo: '+err.message}finally{b.disabled=false}};load().catch(e=>$('#status').textContent='Přehled se nepodařilo načíst: '+e.message);setInterval(()=>{if(data&&!closingIssue&&!document.hidden&&!document.querySelector('.summary:not([hidden]), [data-advice-open], #brief-dialog[open]'))load().catch(()=>{})},60000);
</script></body></html>
