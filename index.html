<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redmine · Přehled</title>
<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;--bg:#101722;--panel:#182535;--line:#34485b;--text:#e9edf4;--muted:#aebfd0;--accent:#9ad6ff;--focus:#82c9fc;background:var(--bg);color:var(--text)}*{box-sizing:border-box}body{margin:0;font-size:16px}header{background:#182333;border-bottom:1px solid var(--line)}header>div{max-width:1440px;margin:auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:22px;margin:0}h2{font-size:19px;margin:0}p{line-height:1.45;color:var(--muted)}.sub{margin:4px 0 0;font-size:14px}button,input,select{font:inherit;color:var(--text);min-height:44px;border:1px solid #4f7598;border-radius:5px}button{background:#294966;padding:9px 14px;cursor:pointer}button:hover{background:#365d80}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}input,select{background:#182333;padding:9px 12px}a{color:var(--accent)}main{max-width:1440px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding:24px 28px}.nav{display:flex;flex-direction:column;gap:5px}.nav button,.map-link{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:10px 13px;min-height:44px;text-decoration:none;background:transparent;border:1px solid transparent;border-radius:5px}.nav button[aria-current=true]{background:#263c51;border-color:#3d5f79;font-weight:600}.nav-count{font-variant-numeric:tabular-nums;color:var(--muted);margin-left:12px}.panel{min-width:0}.status{color:var(--muted);font-size:14px;margin-bottom:22px}.status::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:#8798a8;margin-right:8px;vertical-align:middle}.toolbar{display:flex;align-items:end;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:16px}.toolbar input{width:min(340px,100%)}.results{font-size:14px;color:var(--muted);margin:14px 0 0}.issue{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;padding:20px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.issue h3{font-size:16px;line-height:1.4;margin:0 0 9px}.issue h3 a{color:var(--accent);text-decoration:none}.issue h3 a:hover{text-decoration:underline}.issue p{font-size:14px;margin:6px 0}.customer-line{color:var(--text)}.customer-line a{font-weight:600}.customer-line small{color:var(--muted)}.tag{color:#ffd18b}.age{display:inline-block;font-variant-numeric:tabular-nums;padding:3px 8px;border-radius:4px;background:#263c51;color:#e5f3ff}.age.medium{background:#52411e;color:#ffdf9d}.age.old{background:#5a292c;color:#ffd1ce}.issue-actions{display:flex;flex-direction:column;gap:8px;min-width:178px}.secondary-action{background:#203448}.advice,.summary{grid-column:1/-1;padding:16px 0 4px;border-top:1px solid var(--line)}.advice p{margin:8px 0}.advice strong{color:var(--text)}.advice button{margin:4px 8px 4px 0}.advice label{display:block;margin:12px 0 4px}.advice select{max-width:100%;width:min(100%,300px)}.summary{white-space:pre-wrap}.empty{padding:25px 0}.error{color:#ffc0b9}@media(max-width:750px){header>div{padding:15px 18px}main{display:block;padding:16px 18px}.nav{flex-direction:row;flex-wrap:wrap;margin-bottom:22px;gap:4px}.nav button,.map-link{flex:1 1 auto;justify-content:center;text-align:center}.nav-count{margin-left:6px}.toolbar{align-items:stretch;flex-direction:column;gap:14px}.toolbar input{width:100%}.issue{grid-template-columns:1fr}.issue-actions{min-width:0;display:flex;flex-direction:row;flex-wrap:wrap}.issue-actions button{flex:1 1 150px}.advice button{width:100%;margin:8px 0}.advice select{width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><div><section><h1>Redmine přehled</h1><p class="sub">Úkoly a helpdesk na jednom místě</p></section><button id="sync">Obnovit</button></div></header><main><nav class="nav" aria-label="Přehled"><button data-view="new" aria-current="true">Nové a změněné <span class="nav-count" id="count-new"></span></button><button data-view="mine">Moje úkoly <span class="nav-count" id="count-mine"></span></button><button data-view="helpdesk">Helpdesk <span class="nav-count" id="count-helpdesk"></span></button><a class="map-link" href="mapa">Mapa zákazníků</a></nav><section class="panel"><div id="status" class="status" role="status">Načítám přehled…</div><div class="toolbar"><div><h2 id="title">Nové a změněné</h2><p class="sub">Stáří od přijetí: upozornění po 24 h · zvýraznění po 72 h</p></div><input id="search" type="search" placeholder="Hledat úkol nebo provozovnu" aria-label="Hledat úkol nebo provozovnu"></div><p class="results" id="results" aria-live="polite"></p><div id="list"></div></section></main>
<script>
const appPath=location.pathname.startsWith('/redmine/')?'/redmine':'';
const apiFetch=(path,options)=>fetch(appPath+path,options);
let data, view='new', adviceById=new Map();const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>s?new Date(s).toLocaleString('cs-CZ'):'—';
function age(created){const timestamp=Date.parse(created);if(!Number.isFinite(timestamp))return {text:'Datum přijetí není k dispozici',cls:''};const hours=Math.max(0,Math.floor((Date.now()-timestamp)/3600000));return {text:hours<1?'Přijato před méně než hodinou':hours<24?`Přijato před ${hours} h`:`Přijato před ${Math.floor(hours/24)} ${Math.floor(hours/24)===1?'dnem':'dny'}`,cls:hours>=72?'old':hours>=24?'medium':''}}
function render(){let events=new Map();for(const e of data.events)if(!events.has(e.issue_id))events.set(e.issue_id,e);const isHelpdesk=i=>i.project?.id===12;$('#count-new').textContent=data.issues.filter(i=>events.has(i.id)).length;$('#count-mine').textContent=data.issues.filter(i=>i.mine).length;$('#count-helpdesk').textContent=data.issues.filter(isHelpdesk).length;let list=data.issues.filter(i=>view==='mine'?i.mine:view==='helpdesk'?isHelpdesk(i):events.has(i.id));const q=$('#search').value.trim().toLocaleLowerCase('cs');if(q)list=list.filter(i=>[i.id,i.subject,i.status?.name,i.assigned_to?.name,...(i.customers||[]).map(c=>c.name),...(i.customer_suggestions||[]).map(c=>c.name)].join(' ').toLocaleLowerCase('cs').includes(q));$('#results').textContent=`Zobrazeno: ${list.length}`;$('#title').textContent=({new:'Nové a změněné',mine:'Moje úkoly',helpdesk:'Helpdesk'})[view];$('#status').textContent= data.error?'Synchronizace: '+data.error: data.last_sync?'Poslední synchronizace: '+date(data.last_sync):'Zatím bez synchronizace. Nastavte API klíč.';$('#list').innerHTML=list.length?list.map(i=>`<article class="issue"><div><h3><a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${i.id}">#${i.id} ${esc(i.subject)}</a></h3><p class="customer-line">Provozovna: ${i.customers?.length?i.customers.map(c=>`<a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${c.id}">${esc(c.name)}</a>`).join(', '):i.customer_suggestions?.length?`<span>Návrh: <a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${i.customer_suggestions[0].id}">${esc(i.customer_suggestions[0].name)}</a> · neověřeno${i.customer_suggestions.length>1?' · další možnosti v návrzích':''}</span><br><small>${esc(i.customer_suggestions[0].reason)}</small>`:'provozovna nebyla ověřena'}</p><p>${esc(i.status?.name)} · ${esc(i.assigned_to?.name||'Nepřiřazeno')} · aktualizováno ${date(i.updated_on)}</p><p><span class="age ${age(i.created_on).cls}">${age(i.created_on).text}</span> · přijato ${date(i.created_on)}</p>${view==='new'?`<p>${events.get(i.id)?.kind==='new'?'Nový požadavek':'Změněný požadavek'} · zachyceno ${date(events.get(i.id)?.seen_at)}</p>`:''}${i.hardware_reasons.length?`<p class="tag">Možný hardware: ${esc(i.hardware_reasons.join(', '))}</p>`:''}</div><div class="issue-actions">${i.project?.id===12?`<button data-advice="${i.id}">Návrhy přiřazení</button>`:''}<button class="secondary-action" data-summary="${i.id}" ${data.ai_configured?'':'disabled'} title="${data.ai_configured?'':'Lokální AI není nastavena'}">Shrnout pomocí AI</button></div>${i.project?.id===12?`<section id="advice-${i.id}" class="advice" hidden aria-live="polite"></section>`:''}<div id="summary-${i.id}" hidden class="summary"></div></article>`).join(''):'<p class="empty">Žádné položky k zobrazení. Při prvním načtení se stávající požadavky neoznačují jako nové.</p>'}
function showAdvice(id,v){const el=$('#advice-'+id);adviceById.set(id,v);const cs=v.customer_candidates.filter(c=>!v.linked_customers.some(x=>x.id===c.id));el.innerHTML=`<p><strong>Návrh provozovny</strong></p>${v.linked_customers.length?`<p>Již propojeno: ${v.linked_customers.map(c=>esc(c.name)).join(', ')}</p>`:''}${cs.length?cs.map(c=>`<p>${esc(c.name)} · ${esc(c.reason)} <button data-apply-customer="${c.id}" data-issue="${id}">Propojit zákazníka</button></p>`).join(''):'<p>Žádná použitelná shoda v textu. Ověř požadavek ručně.</p>'}<p><strong>Návrh řešitele</strong></p><p>${v.assignee_suggestion?`${esc(v.assignee_suggestion.name)} · ${esc(v.assignee_suggestion.reason)}; ověř, zda jde skutečně o hardware.`:'Podle obsahu nelze řešitele bezpečně navrhnout.'}</p><label for="member-${id}">Vybrat řešitele</label><select id="member-${id}"><option value="">Vyber osobu</option>${v.members.map(m=>`<option value="${m.id}" ${v.assignee_suggestion?.id===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select> <button data-apply-assignee="${id}">Přiřadit osobu</button><p id="advice-result-${id}" role="status"></p>`}
document.querySelector('#list').addEventListener('click',async e=>{const button=e.target.closest('[data-advice], [data-apply-customer], [data-apply-assignee]');if(!button)return;const id=Number(button.dataset.advice||button.dataset.issue||button.dataset.applyAssignee);if(button.dataset.advice){const panel=$('#advice-'+id);panel.hidden=false;panel.dataset.adviceOpen='true';panel.textContent='Načítám návrhy z místních dat a Redmine…';button.disabled=true;try{const r=await apiFetch('/api/helpdesk-suggestions/'+id,{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);showAdvice(id,v)}catch(err){panel.textContent='Návrhy se nepodařilo načíst: '+err.message}finally{button.disabled=false}return}const v=adviceById.get(id);if(!v)return;const action=button.dataset.applyCustomer?'customer':'assignee';const target=Number(action==='customer'?button.dataset.applyCustomer:$('#member-'+id).value);const choice=action==='customer'?v.customer_candidates.find(c=>c.id===target):v.members.find(m=>m.id===target);if(!choice){$('#advice-result-'+id).textContent='Nejdřív vyber položku.';return}if(!window.confirm(action==='customer'?`Propojit zákazníka „${choice.name}“ s požadavkem #${id} v Redmine?`:`Změnit řešitele požadavku #${id} z „${v.assigned_to?.name||'Nepřiřazeno'}“ na „${choice.name}“ v Redmine?`))return;button.disabled=true;const result=$('#advice-result-'+id);result.textContent='Odesílám změnu…';try{const r=await apiFetch('/api/helpdesk-apply/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,target,updated_on:v.updated_on,state_token:v.state_token})}),body=await r.json();if(!r.ok)throw Error(body.error);result.textContent='Změna je ověřena v Redmine. Před další změnou načti návrhy znovu.';adviceById.delete(id);$('#advice-'+id).querySelectorAll('[data-apply-customer],[data-apply-assignee]').forEach(b=>b.disabled=true)}catch(err){result.textContent='Změnu nelze potvrdit: '+err.message}finally{if(adviceById.has(id))button.disabled=false}});
$('#search').addEventListener('input',()=>{if(data)render()});async function load(){const r=await apiFetch('/api/overview');data=await r.json();render()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-current',String(x===b)));render()});$('#sync').onclick=async()=>{let b=$('#sync');b.disabled=true;$('#status').textContent='Synchronizuji…';try{let r=await apiFetch('/api/sync',{method:'POST'}),v=await r.json();await load();if(!r.ok)$('#status').textContent='Synchronizace selhala: '+v.error}catch(e){$('#status').textContent='Synchronizace selhala: '+e.message}finally{b.disabled=false}};$('#list').onclick=async e=>{let b=e.target.closest('[data-summary]');if(!b)return;let d=$('#summary-'+b.dataset.summary);d.hidden=false;d.textContent='Připravuji shrnutí…';b.disabled=true;try{let r=await apiFetch('/api/summary/'+b.dataset.summary,{method:'POST'}),v=await r.json();d.textContent=r.ok?v.summary:'Shrnutí se nezdařilo: '+v.error}catch(err){d.textContent='Shrnutí se nezdařilo: '+err.message}finally{b.disabled=false}};load().catch(e=>$('#status').textContent='Přehled se nepodařilo načíst: '+e.message);setInterval(()=>{if(data&&!document.hidden&&!document.querySelector('.summary:not([hidden]), [data-advice-open]'))load().catch(()=>{})},60000);
</script></body></html>
