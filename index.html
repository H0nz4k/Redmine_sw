<style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;--bg:#09090b;--panel:#121215;--line:#27272a;--text:#fafafa;--muted:#a1a1aa;--accent:#6366f1;background:var(--bg);color:var(--text)}*{box-sizing:border-box}body{margin:0;font-size:14px}button,input,select{font:inherit;min-height:44px;border:1px solid #3f3f46;border-radius:6px;color:var(--text)}button{background:#27272a;padding:9px 14px;cursor:pointer;font-weight:600}button:hover{background:#3f3f46}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}input,select{background:#18181b;padding:9px 12px}a{color:#e4e4e7}header{position:fixed;top:0;left:0;width:240px;padding:24px 18px 16px;z-index:2}header>div{display:block}h1{font-size:17px;margin:0}h2{font-size:22px;margin:0}p{line-height:1.45;color:var(--muted)}.sub{margin:4px 0;font-size:12px;color:#a1a1aa}header .sub{margin-top:6px}header #sync{position:fixed;right:32px;top:24px;z-index:3;background:#fff;color:#09090b;border-color:#fff}.nav{position:fixed;inset:0 auto 0 0;width:240px;padding:112px 12px 20px;background:#0f0f12;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px}.nav button,.map-link{display:flex;align-items:center;justify-content:space-between;text-align:left;padding:10px 12px;min-height:44px;text-decoration:none;background:transparent;color:#a1a1aa;border:1px solid transparent;border-radius:6px}.nav button:hover,.map-link:hover{background:#18181b;color:#fff}.nav button[aria-current=true]{background:#27272a;color:#fff;font-weight:600}.nav-count{font-variant-numeric:tabular-nums;color:#a1a1aa}.panel{margin-left:240px;min-width:0;padding:30px 32px 60px;max-width:1500px}.toolbar{display:flex;align-items:end;justify-content:space-between;gap:24px;padding-right:190px}.page-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 18px}.status{color:#a1a1aa;font-size:12px}.toolbar input{width:min(340px,100%)}.results{font-size:12px;color:#a1a1aa;margin:24px 0 12px}.issue{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:16px 24px;margin:0 0 10px;padding:18px;background:#121215;border:1px solid #27272a;border-radius:8px;overflow-wrap:anywhere}.issue-heading{display:flex;align-items:baseline;flex-wrap:wrap;gap:7px 10px}.issue-id{color:#a1a1aa;font-size:13px;font-variant-numeric:tabular-nums;text-decoration:none}.issue h3{font-size:16px;line-height:1.4;margin:0;font-weight:700}.issue h3 a{color:#fafafa;text-decoration:none}.issue h3 a:hover,.customer-box a:hover{text-decoration:underline}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:600;line-height:1.3;background:#30303a;color:#e4e4e7}.badge.status-new{background:#27274b;color:#c7c7ff}.badge.status-returned{background:#4d2c25;color:#ffccb0}.badge.status-progress{background:#153d33;color:#a7ead4}.badge.unverified{background:#4c3119;color:#fdba74}.customer-box{margin-top:14px;padding:10px 12px;background:#18181b;border:1px solid #303036;border-radius:6px}.customer-title{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:13px}.customer-title a{font-weight:600;text-decoration:none}.customer-label{color:#a1a1aa}.customer-reason{font-size:12px;color:#a1a1aa;margin:5px 0 0}.meta{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:13px;color:#a1a1aa;font-size:12px;font-variant-numeric:tabular-nums;line-height:1.5}.meta span+span:before{content:'•';margin-right:8px;color:#71717a}.age.medium{color:#fbbf74}.age.old{color:#fca5a5}.issue-actions{display:flex;flex-direction:column;gap:8px}.issue-actions button{width:100%}.primary-action{background:#6366f1;border-color:#6366f1;color:#fff}.primary-action:hover{background:#5155d5}.secondary-action{background:transparent;border-color:#3f3f46;color:#e4e4e7}.advice,.summary{grid-column:1/-1;padding:16px 0 0;border-top:1px solid var(--line)}.advice p{margin:8px 0}.advice strong{color:var(--text)}.advice button{margin:4px 8px 4px 0}.advice label{display:block;margin:12px 0 4px}.advice select{max-width:100%;width:min(100%,300px)}.summary{white-space:pre-wrap}.empty{padding:24px 0}.error{color:#fca5a5}@media(max-width:750px){header{position:static;width:auto;padding:18px 16px 8px}header #sync{position:absolute;top:12px;right:16px}.nav{position:static;width:auto;padding:8px 12px 12px;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.nav button,.map-link{flex:1 1 auto;justify-content:center;gap:8px}.panel{margin:0;padding:24px 16px 48px}.toolbar{padding:0;align-items:stretch;flex-direction:column;gap:14px}.toolbar input{width:100%}.issue{grid-template-columns:1fr;padding:15px}.issue-actions{flex-direction:row;flex-wrap:wrap}.issue-actions button{flex:1 1 150px}.advice button{width:100%;margin:8px 0}.advice select{width:100%}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

</style></head><body><header><div><section><h1>Redmine přehled</h1><p class="sub">Úkoly a helpdesk na jednom místě</p></section><button id="sync" type="button">Načíst z Redmine</button></div></header><main><nav class="nav" aria-label="Přehled"><button data-view="new" aria-current="true">Nové a změněné <span class="nav-count" id="count-new"></span></button><button data-view="mine">Moje úkoly <span class="nav-count" id="count-mine"></span></button><button data-view="helpdesk">Helpdesk <span class="nav-count" id="count-helpdesk"></span></button><button data-view="old">Dlouho otevřené <span class="nav-count" id="count-old"></span></button><a class="map-link" href="mapa">Mapa zákazníků</a></nav><section class="panel"><div class="toolbar"><div><div class="page-heading"><h2 id="title">Nové a změněné</h2><span id="status" class="status" role="status">Načítám přehled…</span></div><p class="sub">Stáří od přijetí: upozornění po 24 h · zvýraznění po 72 h</p></div><input id="search" type="search" placeholder="Hledat úkol nebo provozovnu" aria-label="Hledat úkol nebo provozovnu"></div><section class="filters" aria-label="Filtry úkolů"><div class="filter-row"><span class="filter-label">Stav</span><div class="filter-buttons" id="filter-status" role="group" aria-label="Stav úkolu"></div></div><div class="filter-row"><span class="filter-label">Řešitel</span><div class="filter-buttons" id="filter-assignee" role="group" aria-label="Řešitel"></div></div><div class="filter-row"><span class="filter-label">Stáří</span><div class="filter-buttons" id="filter-age" role="group" aria-label="Stáří od přijetí"></div></div><button type="button" class="filter-reset" id="filter-reset">Zrušit filtry</button></section><p class="results" id="results" aria-live="polite"></p><div id="list"></div></section></main>
<script>
const appPath=location.pathname.startsWith('/redmine/')?'/redmine':'';
const apiFetch=(path,options)=>fetch(appPath+path,options);
let data, view='new', adviceById=new Map();const filters={status:'',assignee:'',age:''};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=s=>s?new Date(s).toLocaleString('cs-CZ'):'—';
function age(created){const timestamp=Date.parse(created);if(!Number.isFinite(timestamp))return {text:'Datum přijetí není k dispozici',cls:''};const hours=Math.max(0,Math.floor((Date.now()-timestamp)/3600000));return {text:hours<1?'Přijato před méně než hodinou':hours<24?`Přijato před ${hours} h`:`Přijato před ${Math.floor(hours/24)} ${Math.floor(hours/24)===1?'dnem':'dny'}`,cls:hours>=72?'old':hours>=24?'medium':''}}
function updateFilters(){
 const statuses=[...new Set(data.issues.map(i=>i.status?.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'cs'));
 const assignees=[...new Map(data.issues.filter(i=>i.assigned_to?.id!=null).map(i=>[String(i.assigned_to.id),i.assigned_to.name||'Bez jména'])).entries()].sort((a,b)=>a[1].localeCompare(b[1],'cs'));
 if(filters.status&&!statuses.includes(filters.status))statuses.push(filters.status);
 if(filters.assignee&&filters.assignee!=='unassigned'&&!assignees.some(x=>x[0]===filters.assignee))assignees.push([filters.assignee,'Dříve vybraný řešitel']);
 const set=(id,kind,choices)=>{$('#'+id).innerHTML=choices.map(([value,label])=>`<button type="button" class="filter-chip" data-filter="${kind}" data-value="${esc(value)}" aria-pressed="${String(filters[kind]===value)}">${esc(label)}</button>`).join('')};
 set('filter-status','status',[['','Všechny'],...statuses.map(x=>[x,x])]);
 set('filter-assignee','assignee',[['','Všichni'],['unassigned','Nepřiřazeno'],...assignees]);
 set('filter-age','age',[['','Vše'],['day','Do 24 hodin'],['three','1–3 dny'],['old','3 dny a více']]);
}
function render(){let events=new Map();for(const e of data.events)if(!events.has(e.issue_id))events.set(e.issue_id,e);const isHelpdesk=i=>i.project?.id===12;const isOld=i=>Number.isFinite(Date.parse(i.created_on))&&Date.now()-Date.parse(i.created_on)>=72*3600000&&!/vyřešen|uzavřen|zavřen|resolved|closed/i.test(i.status?.name||'');$('#count-new').textContent=data.issues.filter(i=>events.has(i.id)).length;$('#count-mine').textContent=data.issues.filter(i=>i.mine).length;$('#count-helpdesk').textContent=data.issues.filter(isHelpdesk).length;$('#count-old').textContent=data.issues.filter(isOld).length;updateFilters();let list=data.issues.filter(i=>view==='mine'?i.mine:view==='helpdesk'?isHelpdesk(i):view==='old'?isOld(i):events.has(i.id));if(filters.status)list=list.filter(i=>i.status?.name===filters.status);if(filters.assignee)list=list.filter(i=>filters.assignee==='unassigned'?i.assigned_to?.id==null:String(i.assigned_to?.id)===filters.assignee);if(filters.age)list=list.filter(i=>{const created=Date.parse(i.created_on),hours=(Date.now()-created)/3600000;return Number.isFinite(created)&&hours>=0&&(filters.age==='day'?hours<24:filters.age==='three'?hours>=24&&hours<72:hours>=72)});const q=$('#search').value.trim().toLocaleLowerCase('cs');if(q)list=list.filter(i=>[i.id,i.subject,i.status?.name,i.assigned_to?.name,...(i.customers||[]).map(c=>c.name),...(i.customer_suggestions||[]).map(c=>c.name)].join(' ').toLocaleLowerCase('cs').includes(q));$('#results').textContent=`Zobrazeno: ${list.length}`;$('#title').textContent=({new:'Nové a změněné',mine:'Moje úkoly',helpdesk:'Helpdesk',old:'Dlouho otevřené'})[view];$('#status').textContent= data.error?'Synchronizace: '+data.error: data.last_sync?'Poslední synchronizace: '+date(data.last_sync):'Zatím bez synchronizace. Nastavte API klíč.';$('#list').innerHTML=list.length?list.map(i=>renderIssue(i,events)).join(''):'<p class="empty">Žádné položky k zobrazení.</p>'}
function renderIssue(i,events){
 const status=(i.status?.name||'').trim().toLocaleLowerCase('cs');
 const created=Date.parse(i.created_on), elapsed=Date.now()-created;
 const resolved=status==='vyřešený';
 const fresh=status==='nový'&&Number.isFinite(created)&&elapsed>=0&&elapsed<72*3600000;
 const cardClass=resolved?'issue-resolved':fresh?'issue-fresh':'';
 const badge=resolved?'status-resolved':({Nový:'status-new',Vrácený:'status-returned',Probíhá:'status-progress'})[i.status?.name]||'';
 const url=`${esc(data.base_url)}/issues/${i.id}`,suggestion=i.customer_suggestions?.[0];
 const customer=i.customers?.length?`<span class="customer-label">Provozovna</span> ${i.customers.map(c=>`<a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${c.id}">${esc(c.name)}</a>`).join(', ')}`:suggestion?`<span class="customer-label">Návrh provozovny</span> <a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${suggestion.id}">${esc(suggestion.name)}</a> <span class="badge unverified">Neověřeno</span>${i.customer_suggestions.length>1?' <span class="customer-label">Další možnosti v návrzích</span>':''}`:'<span class="customer-label">Provozovna nebyla ověřena</span>';
 const meta=[`<span class="age ${age(i.created_on).cls}">${age(i.created_on).text}</span>`,`<span>přijato ${date(i.created_on)}</span>`,`<span>aktualizováno ${date(i.updated_on)}</span>`,`<span>${esc(i.assigned_to?.name||'Nepřiřazeno')}</span>`];
 if(view==='new')meta.push(`<span>${events.get(i.id)?.kind==='new'?'Nový požadavek':'Změněný požadavek'} · zachyceno ${date(events.get(i.id)?.seen_at)}</span>`);
 if(i.hardware_reasons?.length)meta.push(`<span>Možný hardware: ${esc(i.hardware_reasons.join(', '))}</span>`);
 return `<article class="issue ${cardClass}"><div><div class="issue-heading"><a class="issue-id" target="_blank" rel="noopener noreferrer" href="${url}">#${i.id}</a><h3><a target="_blank" rel="noopener noreferrer" href="${url}">${esc(i.subject)}</a></h3><span class="badge ${badge}">${esc(i.status?.name||'Neznámý stav')}</span></div><div class="customer-box"><div class="customer-title">${customer}</div>${!i.customers?.length&&suggestion?`<p class="customer-reason">${esc(suggestion.reason)}</p>`:''}</div><div class="meta">${meta.join('')}</div></div><div class="issue-actions">${i.project?.id===12?`<button class="primary-action" data-advice="${i.id}">Návrhy přiřazení</button>`:''}<button class="secondary-action" data-summary="${i.id}" ${data.ai_configured?'':'disabled'} title="${data.ai_configured?'':'Lokální AI není nastavena'}"><span aria-hidden="true">✦</span> Shrnout pomocí AI</button></div>${i.project?.id===12?`<section id="advice-${i.id}" class="advice" hidden aria-live="polite"></section>`:''}<div id="summary-${i.id}" hidden class="summary"></div></article>`
}
function showAdvice(id,v){const el=$('#advice-'+id);adviceById.set(id,v);const cs=v.customer_candidates.filter(c=>!v.linked_customers.some(x=>x.id===c.id));el.innerHTML=`<p><strong>Návrh provozovny</strong></p>${v.linked_customers.length?`<p>Již propojeno: ${v.linked_customers.map(c=>esc(c.name)).join(', ')}</p>`:''}${cs.length?cs.map(c=>`<p>${esc(c.name)} · ${esc(c.reason)} <button data-apply-customer="${c.id}" data-issue="${id}">Propojit zákazníka</button></p>`).join(''):'<p>Žádná použitelná shoda v textu. Ověř požadavek ručně.</p>'}<p><strong>Návrh řešitele</strong></p><p>${v.assignee_suggestion?`${esc(v.assignee_suggestion.name)} · ${esc(v.assignee_suggestion.reason)}; ověř, zda jde skutečně o hardware.`:'Podle obsahu nelze řešitele bezpečně navrhnout.'}</p><label for="member-${id}">Vybrat řešitele</label><select id="member-${id}"><option value="">Vyber osobu</option>${v.members.map(m=>`<option value="${m.id}" ${v.assignee_suggestion?.id===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select> <button data-apply-assignee="${id}">Přiřadit osobu</button><p id="advice-result-${id}" role="status"></p>`}
document.querySelector('#list').addEventListener('click',async e=>{const button=e.target.closest('[data-advice], [data-apply-customer], [data-apply-assignee]');if(!button)return;const id=Number(button.dataset.advice||button.dataset.issue||button.dataset.applyAssignee);if(button.dataset.advice){const panel=$('#advice-'+id);panel.hidden=false;panel.dataset.adviceOpen='true';panel.textContent='Načítám návrhy z místních dat a Redmine…';button.disabled=true;try{const r=await apiFetch('/api/helpdesk-suggestions/'+id,{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);showAdvice(id,v)}catch(err){panel.textContent='Návrhy se nepodařilo načíst: '+err.message}finally{button.disabled=false}return}const v=adviceById.get(id);if(!v)return;const action=button.dataset.applyCustomer?'customer':'assignee';const target=Number(action==='customer'?button.dataset.applyCustomer:$('#member-'+id).value);const choice=action==='customer'?v.customer_candidates.find(c=>c.id===target):v.members.find(m=>m.id===target);if(!choice){$('#advice-result-'+id).textContent='Nejdřív vyber položku.';return}if(!window.confirm(action==='customer'?`Propojit zákazníka „${choice.name}“ s požadavkem #${id} v Redmine?`:`Změnit řešitele požadavku #${id} z „${v.assigned_to?.name||'Nepřiřazeno'}“ na „${choice.name}“ v Redmine?`))return;button.disabled=true;const result=$('#advice-result-'+id);result.textContent='Odesílám změnu…';try{const r=await apiFetch('/api/helpdesk-apply/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,target,updated_on:v.updated_on,state_token:v.state_token})}),body=await r.json();if(!r.ok)throw Error(body.error);result.textContent='Změna je ověřena v Redmine. Před další změnou načti návrhy znovu.';adviceById.delete(id);$('#advice-'+id).querySelectorAll('[data-apply-customer],[data-apply-assignee]').forEach(b=>b.disabled=true)}catch(err){result.textContent='Změnu nelze potvrdit: '+err.message}finally{if(adviceById.has(id))button.disabled=false}});
document.querySelector('.filters').addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b||!data)return;filters[b.dataset.filter]=b.dataset.value;render();const buttons=document.querySelectorAll('[data-filter]');for(const item of buttons)if(item.dataset.filter===b.dataset.filter&&item.dataset.value===b.dataset.value){item.focus();break}});$('#filter-reset').addEventListener('click',()=>{filters.status='';filters.assignee='';filters.age='';$('#search').value='';if(data)render()});$('#search').addEventListener('input',()=>{if(data)render()});async function load(){const r=await apiFetch('/api/overview');data=await r.json();render()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-current',String(x===b)));render()});$('#sync').onclick=async()=>{let b=$('#sync');b.disabled=true;b.textContent='Načítám…';$('#status').textContent='Načítám aktuální úkoly z Redmine…';try{let r=await apiFetch('/api/sync',{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error||'Server odmítl synchronizaci');await load()}catch(e){$('#status').textContent='Načtení z Redmine selhalo: '+e.message}finally{b.disabled=false;b.textContent='Načíst z Redmine'}};$('#list').onclick=async e=>{let b=e.target.closest('[data-summary]');if(!b)return;let d=$('#summary-'+b.dataset.summary);d.hidden=false;d.textContent='Připravuji shrnutí…';b.disabled=true;try{let r=await apiFetch('/api/summary/'+b.dataset.summary,{method:'POST'}),v=await r.json();d.textContent=r.ok?v.summary:'Shrnutí se nezdařilo: '+v.error}catch(err){d.textContent='Shrnutí se nezdařilo: '+err.message}finally{b.disabled=false}};load().catch(e=>$('#status').textContent='Přehled se nepodařilo načíst: '+e.message);setInterval(()=>{if(data&&!document.hidden&&!document.querySelector('.summary:not([hidden]), [data-advice-open]'))load().catch(()=>{})},60000);
</script></body></html>
