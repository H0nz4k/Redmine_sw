argin-top:4px}.customer button{margin-top:8px}.map-wrap{position:relative;background:#18181b;border:1px solid #27272a;border-radius:8px;overflow:hidden}.map{height:520px;background:#18181b}.map-message{position:absolute;z-index:500;left:60px;top:12px;background:#18181b;padding:10px;max-width:70%;color:#fafafa}.map-logo{position:absolute;bottom:22px;left:12px;z-index:500;background:white;padding:3px}.map-logo img{height:30px;display:block}.detail{border-top:1px solid #27272a;margin-top:16px;scroll-margin-top:16px}.detail h2{margin-bottom:4px}.detail p{margin:5px 0 12px}.detail button{margin:0 8px 8px 0}.coords{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.coords label{display:flex;flex-direction:column;gap:4px;color:#a1a1aa;font-size:12px;flex:1 1 140px}.coords input{width:100%;font-variant-numeric:tabular-nums}.coords button{align-self:end}.leaflet-control-attribution{color:#18181b}.map-legend{display:flex;gap:8px 16px;flex-wrap:wrap;margin:10px 0;color:#a1a1aa;font-size:12px}.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:#8794a4}.legend-dot.open{background:#cf3545}.legend-dot.closed{background:#16834d}.leaflet-tile-pane{filter:saturate(.45) brightness(.9)}@media(max-width:750px){header div,main{padding:16px}.layout{display:flex;flex-direction:column}.list{height:auto;max-height:32vh}.map{height:clamp(260px,45vh,400px)}.map-message{max-width:calc(100% - 72px)}.detail button{width:100%;margin-right:0}.coords button{width:auto;flex:1 1 100%}}

</style></head><body><header><div><h1>Mapa zákazníků</h1><div class="header-actions"><a href="./">Zpět na přehled</a><button type="button" id="sync-redmine">Načíst z Redmine</button></div></div></header><p id="sync-status" class="sync-status" role="status" aria-live="polite" hidden></p><main><div class="layout"><section class="customer-panel"><div id="customer-list-view"><div class="tools"><input id="search" type="search" placeholder="Hledat zákazníka nebo adresu" aria-label="Hledat zákazníka nebo adresu"></div><div class="segments" role="group" aria-label="Zdroj zákazníků"><button id="map-list" type="button" aria-pressed="true">V seznamu</button><button id="compare" type="button" aria-pressed="false">Porovnat s Redmine</button></div><div class="scan-control"><button id="scan" type="button">Zkontrolovat související úkoly</button></div><section class="trip" aria-labelledby="trip-title"><h2 id="trip-title">Plán výjezdu</h2><label for="trip-address">Výchozí adresa</label><input id="trip-address" placeholder="Např. adresa odjezdu"><p class="trip-note">Adresu urči bodem na mapě; zůstane v tomto prohlížeči.</p><button type="button" id="trip-start">Vybrat začátek kliknutím na mapu</button><p id="trip-start-status" role="status">Výchozí bod není vybrán.</p><ol id="trip-list" class="trip-list"></ol><p id="trip-result" class="trip-note" role="status">Přidej zákazníky z detailu na mapě.</p><div class="trip-actions"><button type="button" id="trip-optimize">Seřadit zastávky</button><button type="button" id="trip-clear">Vymazat plán</button></div></section><p id="count" class="count" role="status">Načítám…</p><div class="list" id="list"></div></div><div id="detail-view" hidden><button type="button" id="back-to-list" class="back-to-list">← Zpět na seznam</button><div id="detail" class="detail"></div></div></section><section><div class="map-wrap"><div id="map" class="map" aria-label="Mapa zákazníků"></div><div id="map-message" class="map-message" hidden></div><a class="map-logo" id="logo" href="https://mapy.com/" target="_blank" rel="noopener" hidden><img src="https://api.mapy.com/img/api/logo.svg" alt="Mapy.com"></a></div><div class="map-legend" aria-label="Legenda stavů"><span><i class="legend-dot open" aria-hidden="true"></i>Otevřené úkoly</span><span><i class="legend-dot closed" aria-hidden="true"></i>Nalezené úkoly uzavřené</span><span><i class="legend-dot" aria-hidden="true"></i>Neověřeno nebo bez vazby</span></div></section></div></main><script src="vendor/leaflet/leaflet.js"></script><script>
const appPath=location.pathname.startsWith('/redmine/')?'/redmine':'';
const apiFetch=(path,options)=>fetch(appPath+path,options);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,selected=null,markers=[], mode='map', redmineCustomers=[];const map=L.map('map').setView([49.8,15.5],7);const list=document.querySelector('#list'),detail=document.querySelector('#detail'),message=document.querySelector('#map-message');
document.querySelector('#sync-redmine').addEventListener('click',async()=>{const b=document.querySelector('#sync-redmine'),status=document.querySelector('#sync-status');b.disabled=true;b.textContent='Načítám…';status.hidden=false;status.textContent='Načítám aktuální úkoly z Redmine…';try{const response=await apiFetch('/api/sync',{method:'POST'}),result=await response.json();if(!response.ok)throw Error(result.error||'Server odmítl synchronizaci');const refreshed=await apiFetch('/api/customers');if(!refreshed.ok)throw Error('Seznam zákazníků se nepodařilo načíst');data=await refreshed.json();draw();const current=data.customers.find(c=>c.issue_id===selected),label=document.querySelector('#current-status');if(current&&label)label.textContent='Úkoly: '+statusLabel(current.related_status)+(current.related_status?.checked_at?' · kontrola '+new Date(current.related_status.checked_at).toLocaleString('cs-CZ'):'');status.textContent='Úkoly načteny z Redmine · '+new Date().toLocaleString('cs-CZ')+'. Stav souvisejících úkolů aktualizuje samostatná kontrola.'}catch(e){status.textContent='Načtení z Redmine selhalo: '+e.message}finally{b.disabled=false;b.textContent='Načíst z Redmine'}});
function statusLabel(s){return s?({'open':'Otevřené úkoly','closed':'Všechny nalezené uzavřené','none':'Bez nalezených vazeb','unknown':'Stav není úplný'}[s.state]||'Neověřeno'):'Neověřeno'}
function showList(){document.querySelector('#map-list').setAttribute('aria-pressed',String(mode==='map'));document.querySelector('#compare').setAttribute('aria-pressed',String(mode==='redmine'));if(mode==='redmine'){showComparison();return}const q=document.querySelector('#search').value.toLocaleLowerCase('cs');const filtered=data.customers.filter(c=>(c.name+' '+c.address+' '+c.issue_id).toLocaleLowerCase('cs').includes(q));document.querySelector('#count').textContent=`${filtered.length} zákazníků · ${data.customers.filter(c=>c.location).length} se souřadnicemi`;list.innerHTML=filtered.map(c=>`<button class="customer ${selected===c.issue_id?'selected':''}" data-id="${c.issue_id}"><strong>${esc(c.name)}</strong><span>${esc(c.address||'Adresa chybí')}</span><span>#${c.issue_id}${c.location?(c.location_source==='Ručně potvrzeno'?' · potvrzeno':' · poloha k ověření'):' · bez souřadnic'} · ${esc(statusLabel(c.related_status))}</span></button>`).join('')||`<p>Žádný zákazník neodpovídá hledání.${q?` <a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(q)}">Vyhledat tento název na Googlu</a> (odešle hledaný text Googlu).`:''}</p>`}
function showComparison(){const q=document.querySelector('#search').value.toLocaleLowerCase('cs');const filtered=redmineCustomers.filter(c=>(c.name+' '+c.address+' '+c.id).toLocaleLowerCase('cs').includes(q));document.querySelector('#count').textContent=`${filtered.length} zákazníků z Redmine · ${redmineCustomers.filter(c=>!c.in_map).length} mimo mapový seznam`;list.innerHTML=filtered.map(c=>`<div class="customer"><strong>${esc(c.name)}</strong><span>#${c.id} · ${esc(c.status)} · ${c.in_map?'v mapovém seznamu':'mimo mapový seznam'}</span><span>${esc(c.address||'Adresa v Redmine chybí')}</span>${c.in_map?`<button type="button" data-open="${c.id}">Zobrazit</button>`:`<button type="button" data-add="${c.id}">Přidat do seznamu</button>`}</div>`).join('')||`<p>Žádný zákazník neodpovídá hledání.${q?` <a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(q)}">Vyhledat tento název na Googlu</a> (odešle hledaný text Googlu).`:''}</p>`}
async function compare(){document.querySelector('#count').textContent='Načítám zákazníky z Redmine…';try{const r=await apiFetch('/api/redmine-customers',{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);redmineCustomers=v.customers;mode='redmine';showList()}catch(e){document.querySelector('#count').textContent='Porovnání se nezdařilo: '+e.message}}
async function refreshScan(){try{let r=await apiFetch('/api/scan-status'),v=await r.json();document.querySelector('#count').textContent=`Kontrola úkolů: ${v.done}/${v.total}, chyby: ${v.errors}`;if(v.running){setTimeout(refreshScan,2000)}else{let r=await apiFetch('/api/customers');data=await r.json();draw();if(v.errors)document.querySelector('#count').textContent+=` · neověřeno kvůli chybě: ${v.errors}`}}catch(e){document.querySelector('#count').textContent='Kontrola se nezdařila: '+e.message}}
document.querySelector('#scan').addEventListener('click',async()=>{try{let r=await apiFetch('/api/scan-status',{method:'POST'});if(!r.ok)throw Error('server odmítl požadavek');refreshScan()}catch(e){document.querySelector('#count').textContent='Kontrola se nezdařila: '+e.message}});
document.querySelector('#back-to-list').addEventListener('click',()=>{document.querySelector('#detail-view').hidden=true;document.querySelector('#customer-list-view').hidden=false;showList();document.querySelector('#search').focus()});
document.querySelector('#compare').addEventListener('click',compare);document.querySelector('#map-list').addEventListener('click',()=>{mode='map';showList()});
list.addEventListener('click',async e=>{const add=e.target.closest('[data-add]'),open=e.target.closest('[data-open]');if(open){mode='map';select(Number(open.dataset.open));return}if(!add)return;add.disabled=true;try{const r=await apiFetch('/api/add-customer/'+add.dataset.add,{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);const refreshed=await apiFetch('/api/customers');data=await refreshed.json();redmineCustomers.find(c=>c.id===Number(add.dataset.add)).in_map=true;showList();draw()}catch(err){document.querySelector('#count').textContent='Přidání se nezdařilo: '+err.message;add.disabled=false}});
function select(id){const c=data.customers.find(x=>x.issue_id===id);if(!c)return;selected=id;showList();document.querySelector('#customer-list-view').hidden=true;document.querySelector('#detail-view').hidden=false;document.querySelector('#detail-view').scrollTop=0;detail.innerHTML=`<h2>${esc(c.name)}</h2><p>${esc(c.address||'Adresa chybí')} · <a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${c.issue_id}">Záznam v Redmine #${c.issue_id}</a></p><p>${esc(c.location_source||'Souřadnice nejsou k dispozici.')}</p><p>Identifikátor odpovídá záznamu v Redmine; údaje o provozovně ověř před výjezdem.${c.in_open_issues?' Záznam je v aktuálních otevřených úkolech.':''}</p><button type="button" id="trip-add">Přidat do výjezdu</button><p id="trip-add-result" role="status"></p><p id="current-status">Úkoly: ${esc(statusLabel(c.related_status))}${c.related_status?.checked_at?' · kontrola '+new Date(c.related_status.checked_at).toLocaleString('cs-CZ'):''}</p><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(c.name)}">Hledat název na Googlu</a><p>Odkaz při otevření odešle název zákazníka Googlu.</p><button type="button" id="redmine-data">Dohledat údaje v Redmine</button><div id="redmine-details" role="status"></div><button type="button" id="find-issues">Načíst související úkoly</button><div id="related" role="status"></div><form class="coords"><label>Zeměpisná šířka<input name="lat" required type="number" step="any" min="-90" max="90" value="${c.location?.[0]??''}"></label><label>Zeměpisná délka<input name="lon" required type="number" step="any" min="-180" max="180" value="${c.location?.[1]??''}"></label><button>Uložit polohu</button><span role="status" id="saved"></span></form>`;if(c.location)map.setView(c.location,14);if(matchMedia('(max-width: 750px)').matches)detail.scrollIntoView({block:'start',behavior:'auto'})}
const trip={ids:[],start:null,address:'',picking:false,line:null,startMarker:null};
function km(a,b){const rad=Math.PI/180,dlat=(b[0]-a[0])*rad,dlon=(b[1]-a[1])*rad;const h=Math.sin(dlat/2)**2+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dlon/2)**2;return 12742*Math.asin(Math.sqrt(Math.min(1,h)))}
function validPoint(p){return Array.isArray(p)&&p.length===2&&p.every(Number.isFinite)&&Math.abs(p[0])<=90&&Math.abs(p[1])<=180}
function saveTrip(){try{localStorage.setItem('redmine-trip-v1',JSON.stringify({ids:trip.ids,start:trip.start,address:trip.address}))}catch(e){document.querySelector('#trip-result').textContent='Plán nelze uložit v tomto prohlížeči.'}}
function renderTrip(){const customers=trip.ids.map(id=>data.customers.find(c=>c.issue_id===id)||{issue_id:id,name:'Zákazník #'+id+' není v seznamu'});document.querySelector('#trip-list').innerHTML=customers.map(c=>`<li>${esc(c.name)}${validPoint(c.location)?'':' · chybí souřadnice'} <button type="button" data-trip-remove="${c.issue_id}" aria-label="Odebrat ${esc(c.name)}">Odebrat</button></li>`).join('');document.querySelector('#trip-start-status').textContent=trip.start?'Výchozí bod vybrán'+(trip.address?' · '+trip.address:''):'Výchozí bod není vybrán.';if(trip.line)map.removeLayer(trip.line);if(trip.startMarker)map.removeLayer(trip.startMarker);trip.line=null;trip.startMarker=null;if(trip.start)trip.startMarker=L.circleMarker(trip.start,{radius:8,color:'#4f46b9',weight:3,fillColor:'#fff',fillOpacity:1}).addTo(map).bindTooltip('Začátek výjezdu');const coords=customers.map(c=>c.location).filter(validPoint);const points=(trip.start?[trip.start]:[]).concat(coords);if(points.length>1)trip.line=L.polyline(points,{color:'#4f46b9',weight:3,dashArray:'7 7'}).addTo(map);const missing=customers.length-coords.length;let distance=0;for(let n=1;n<points.length;n++)distance+=km(points[n-1],points[n]);document.querySelector('#trip-result').textContent=customers.length?`${customers.length} zastávek${missing?' · bez souřadnic: '+missing:''} · ${distance.toFixed(1)} km vzdušnou čarou. Nejde o silniční trasu ani čas jízdy.`:'Přidej zákazníky z detailu na mapě.'}
try{const saved=JSON.parse(localStorage.getItem('redmine-trip-v1')||'{}');trip.ids=Array.isArray(saved.ids)?saved.ids.filter(Number.isInteger).slice(0,100):[];trip.start=validPoint(saved.start)?saved.start:null;trip.address=typeof saved.address==='string'?saved.address.slice(0,300):''}catch(e){}document.querySelector('#trip-address').value=trip.address;
document.querySelector('#trip-address').addEventListener('input',e=>{trip.address=e.target.value.slice(0,300);saveTrip();if(data)renderTrip()});
document.querySelector('#trip-start').addEventListener('click',()=>{trip.picking=true;document.querySelector('#trip-start-status').textContent='Klikni na mapu na místo odjezdu.'});
map.on('click',e=>{if(!trip.picking)return;trip.picking=false;trip.start=[e.latlng.lat,e.latlng.lng];saveTrip();renderTrip()});
document.querySelector('#trip-list').addEventListener('click',e=>{const b=e.target.closest('[data-trip-remove]');if(!b)return;trip.ids=trip.ids.filter(id=>id!==Number(b.dataset.tripRemove));saveTrip();renderTrip()});
document.querySelector('#trip-clear').addEventListener('click',()=>{trip.ids=[];trip.start=null;trip.address='';trip.picking=false;document.querySelector('#trip-address').value='';saveTrip();renderTrip()});
document.querySelector('#trip-optimize').addEventListener('click',()=>{if(!trip.start){document.querySelector('#trip-result').textContent='Nejdřív vyber výchozí bod kliknutím na mapu.';return}let remaining=trip.ids.map(id=>data.customers.find(c=>c.issue_id===id)||{issue_id:id,name:'Zákazník #'+id+' není v seznamu'}), ordered=[], current=trip.start;while(remaining.some(c=>validPoint(c.location))){let best=remaining.filter(c=>validPoint(c.location)).sort((a,b)=>km(current,a.location)-km(current,b.location)||a.issue_id-b.issue_id)[0];ordered.push(best.issue_id);current=best.location;remaining=remaining.filter(c=>c.issue_id!==best.issue_id)}trip.ids=ordered.concat(remaining.map(c=>c.issue_id));saveTrip();renderTrip()});
detail.addEventListener('click',e=>{if(e.target.id!=='trip-add')return;const c=data.customers.find(x=>x.issue_id===selected);if(!c)return;if(!trip.ids.includes(c.issue_id)){if(trip.ids.length>=100){document.querySelector('#trip-add-result').textContent='Plán může obsahovat nejvýše 100 zastávek.';return}trip.ids.push(c.issue_id)}saveTrip();renderTrip();document.querySelector('#trip-add-result').textContent=validPoint(c.location)?'Přidáno do plánu výjezdu.':'Přidáno; pro pořadí je potřeba doplnit souřadnice.'});
function draw(){for(const m of markers)map.removeLayer(m);markers=[];for(const c of data.customers){if(!c.location)continue;const m=L.circleMarker(c.location,{radius:7,color:'#fff',weight:2,fillColor:c.related_status?.state==='open'?'#cf3545':c.related_status?.state==='closed'?'#16834d':'#8794a4',fillOpacity:1}).addTo(map);m.bindTooltip(esc(c.name));m.on('click',()=>select(c.issue_id));markers.push(m)}showList();renderTrip()}
detail.addEventListener('click',async e=>{if(e.target.id!=='redmine-data')return;const id=selected,target=document.querySelector('#redmine-details');e.target.disabled=true;target.textContent='Načítám údaje…';try{const r=await apiFetch('/api/customer-details/'+id,{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);if(id===selected)target.innerHTML=`<p>Redmine: ${esc(v.name)}<br>Adresa: ${esc(v.address||'neuvedena')}<br>GPS: ${esc(v.gps||'neuvedeno')}</p>`}catch(err){if(id===selected)target.textContent='Údaje se nepodařilo načíst: '+err.message}finally{e.target.disabled=false}});
detail.addEventListener('click',async e=>{if(e.target.id!=='find-issues')return;const id=selected, target=document.querySelector('#related');e.target.disabled=true;target.textContent='Hledám vazby v Redmine…';try{const r=await apiFetch('/api/customer-issues/'+id,{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);if(id!==selected)return;target.innerHTML=v.issues.length?v.issues.map(i=>`<p>${i.open?'Otevřený':'Uzavřený'} · <a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${i.id}">#${i.id} ${esc(i.subject)}</a> · ${esc(i.status)}</p>`).join(''):'<p>Žádná nalezená související vazba.</p>';if(v.inaccessible)target.insertAdjacentHTML('beforeend',`<p>Neověřeno z důvodu nedostupných úkolů: ${v.inaccessible}</p>`);const c=data.customers.find(x=>x.issue_id===id);c.related_status=v;draw()}catch(err){if(id===selected)target.textContent='Nepodařilo se ověřit vazby: '+err.message}finally{e.target.disabled=false}});
list.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)select(Number(b.dataset.id))});document.querySelector('#search').addEventListener('input',showList);detail.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,s=document.querySelector('#saved');s.textContent='Ukládám…';try{const r=await apiFetch('/api/location/'+selected,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat:f.lat.value,lon:f.lon.value})});const d=await r.json();if(!r.ok)throw Error(d.error);const c=data.customers.find(x=>x.issue_id===selected);c.location=[Number(f.lat.value),Number(f.lon.value)];draw();map.setView(c.location,14);s.textContent='Uloženo.'}catch(err){s.textContent='Nepodařilo se uložit: '+err.message}});
setInterval(async()=>{if(document.hidden)return;try{const r=await apiFetch('/api/customers');if(!r.ok)return;data=await r.json();draw();const c=data.customers.find(x=>x.issue_id===selected),status=document.querySelector('#current-status');if(c&&status)status.textContent='Úkoly: '+statusLabel(c.related_status)+(c.related_status?.checked_at?' · kontrola '+new Date(c.related_status.checked_at).toLocaleString('cs-CZ'):'')}catch(e){}},60000);
apiFetch('/api/customers').then(r=>r.json()).then(d=>{data=d;if(d.map_configured){L.tileLayer(appPath+'/maptiles/{z}/{x}/{y}',{maxZoom:19,attribution:'<a href="https://api.mapy.com/copyright" target="_blank" rel="noopener">© Seznam.cz a.s. a další</a>'}).addTo(map);document.querySelector('#logo').hidden=false}else{message.hidden=false;message.textContent='Mapový podklad čeká na nastavení API klíče Mapy.com.'}draw();const points=data.customers.filter(c=>c.location).map(c=>c.location);if(points.length)map.fitBounds(points,{padding:[25,25],maxZoom:13})}).catch(()=>{message.hidden=false;message.textContent='Seznam zákazníků se nepodařilo načíst.'});
</script></body></html>
