<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa zákazníků · Redmine</title><link rel="stylesheet" href="vendor/leaflet/leaflet.css"><style>
:root{font-family:system-ui,sans-serif;color:#fafafa;background:#09090b;color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-size:14px}header{border-bottom:1px solid #27272a;background:#0f0f12}header div,main{max-width:1500px;margin:auto;padding:18px 24px}header div{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:20px;margin:0}h2{font-size:18px}p{color:#a1a1aa;line-height:1.5}a{color:#e4e4e7}button,input{font:inherit;border-radius:6px;padding:10px;border:1px solid #3f3f46;min-height:44px}button{background:#27272a;color:#fafafa;cursor:pointer;font-weight:600}button:hover{background:#3f3f46}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}input{background:#18181b;color:#fff;min-width:0}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px}.customer-panel{background:#121215;border:1px solid #27272a;border-radius:8px;min-width:0;overflow:hidden}.tools{display:flex;gap:8px;flex-wrap:wrap;padding:12px 12px 0}.tools input{width:100%}.segments{display:flex;background:#09090b;border:1px solid #27272a;border-radius:6px;padding:3px;margin:12px 12px 0}.segments button{flex:1;min-width:0;border:0;background:transparent;font-size:12px;padding:7px 5px;color:#a1a1aa}.segments button[aria-pressed=true]{background:#27272a;color:#fff}.scan-control{padding:10px 12px 0}.scan-control button{width:100%;background:transparent;font-size:12px}.count{font-variant-numeric:tabular-nums;font-size:12px;margin:12px}.list{height:calc(100vh - 320px);min-height:220px;max-height:70vh;overflow:auto;border-top:1px solid #27272a;overscroll-behavior:contain}.customer{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #27272a;border-radius:0;background:transparent;padding:10px 12px;overflow-wrap:anywhere}.customer.selected{background:#27272a}.customer strong{font-size:14px}.customer span{display:block;color:#a1a1aa;font-size:12px;margin-top:4px}.customer button{margin-top:8px}.map-wrap{position:relative;background:#18181b;border:1px solid #27272a;border-radius:8px;overflow:hidden}.map{height:520px;background:#18181b}.map-message{position:absolute;z-index:500;left:60px;top:12px;background:#18181b;padding:10px;max-width:70%;color:#fafafa}.map-logo{position:absolute;bottom:22px;left:12px;z-index:500;background:white;padding:3px}.map-logo img{height:30px;display:block}.detail{border-top:1px solid #27272a;margin-top:16px;scroll-margin-top:16px}.detail h2{margin-bottom:4px}.detail p{margin:5px 0 12px}.detail button{margin:0 8px 8px 0}.coords{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.coords label{display:flex;flex-direction:column;gap:4px;color:#a1a1aa;font-size:12px;flex:1 1 140px}.coords input{width:100%;font-variant-numeric:tabular-nums}.coords button{align-self:end}.leaflet-control-attribution{color:#18181b}.map-legend{display:flex;gap:8px 16px;flex-wrap:wrap;margin:10px 0;color:#a1a1aa;font-size:12px}.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:#8794a4}.legend-dot.open{background:#cf3545}.legend-dot.closed{background:#16834d}.leaflet-tile-pane{filter:saturate(.45) brightness(.9)}@media(max-width:750px){header div,main{padding:16px}.layout{display:flex;flex-direction:column}.list{height:auto;max-height:32vh}.map{height:clamp(260px,45vh,400px)}.map-message{max-width:calc(100% - 72px)}.detail button{width:100%;margin-right:0}.coords button{width:auto;flex:1 1 100%}}

#detail-view{padding:12px;max-height:calc(100vh - 130px);overflow:auto;overscroll-behavior:contain}#detail-view[hidden],#customer-list-view[hidden]{display:none}.back-to-list{background:transparent;border:0;padding:4px 0;color:#d4d4d8}.detail{border-top:1px solid #27272a;margin-top:8px;padding-top:8px;overflow-wrap:anywhere}.detail h2{margin-top:8px}.detail button{width:100%;margin:0 0 8px}.coords{display:grid;grid-template-columns:1fr 1fr}.coords label{min-width:0}.coords button,.coords [role=status]{grid-column:1/-1}@media(max-width:750px){#detail-view{max-height:none}.coords{grid-template-columns:1fr 1fr}}

/* Stejné grafitové plochy jako v přehledu; mapa zůstává tlumená. */
:root{background:#292b30;color:#fafafa}header{background:#303238;border-color:#626670}p,.customer span,.coords label,.map-legend{color:#d1d4da}
.customer-panel{background:#383b42;border-color:#626670}.segments{background:#303238;border-color:#777d88}.segments button{color:#d1d4da}.segments button[aria-pressed=true]{background:#565a64;color:#fff}
button{background:#50545d;border-color:#777d88}button:hover{background:#60656e}input{background:#303238;border-color:#838995;color:#fff}input::placeholder{color:#c2c6ce}.scan-control button{border-color:#969ba5}.list,.customer{border-color:#626670}.customer.selected{background:#565a64}.customer:hover{background:#50545d}
.map-wrap{background:#383b42;border-color:#777d88}.map{background:#383b42}.map-message{background:#383b42}.detail{border-color:#626670}.back-to-list{color:#fafafa}

/* Stejné světlé povrchy jako v přehledu. */
:root{color-scheme:light;background:#e7ecef;color:#202a33}header{background:#d8e0e5;border-color:#aebbc4}p,.customer span,.coords label,.map-legend{color:#4d5a65}a{color:#284a69}
.customer-panel{background:#fff;border-color:#bcc6cd}.segments{background:#e7ecef;border-color:#bcc6cd}.segments button{color:#4d5a65}.segments button[aria-pressed=true]{background:#c7d4dd;color:#202a33}
button{background:#e2e8ec;border-color:#9eacb6;color:#263641}button:hover{background:#ccd8df}input{background:#fff;border-color:#8f9eaa;color:#202a33}input::placeholder{color:#586977}.scan-control button{border-color:#8799a5}.list,.customer{border-color:#c9d2d8}.customer.selected{background:#d3e0e8}.customer:hover{background:#e6eef2}
.map-wrap{background:#e3e9ec;border-color:#9eacb6}.map{background:#e3e9ec}.map-message{background:#fff;color:#202a33}.detail{border-color:#bcc6cd}.back-to-list{color:#263641}
</style></head><body><header><div><h1>Mapa zákazníků</h1><a href="./">Zpět na přehled</a></div></header><main><div class="layout"><section class="customer-panel"><div id="customer-list-view"><div class="tools"><input id="search" type="search" placeholder="Hledat zákazníka nebo adresu" aria-label="Hledat zákazníka nebo adresu"></div><div class="segments" role="group" aria-label="Zdroj zákazníků"><button id="map-list" type="button" aria-pressed="true">V seznamu</button><button id="compare" type="button" aria-pressed="false">Porovnat s Redmine</button></div><div class="scan-control"><button id="scan" type="button">Zkontrolovat související úkoly</button></div><p id="count" class="count" role="status">Načítám…</p><div class="list" id="list"></div></div><div id="detail-view" hidden><button type="button" id="back-to-list" class="back-to-list">← Zpět na seznam</button><div id="detail" class="detail"></div></div></section><section><div class="map-wrap"><div id="map" class="map" aria-label="Mapa zákazníků"></div><div id="map-message" class="map-message" hidden></div><a class="map-logo" id="logo" href="https://mapy.com/" target="_blank" rel="noopener" hidden><img src="https://api.mapy.com/img/api/logo.svg" alt="Mapy.com"></a></div><div class="map-legend" aria-label="Legenda stavů"><span><i class="legend-dot open" aria-hidden="true"></i>Otevřené úkoly</span><span><i class="legend-dot closed" aria-hidden="true"></i>Nalezené úkoly uzavřené</span><span><i class="legend-dot" aria-hidden="true"></i>Neověřeno nebo bez vazby</span></div></section></div></main><script src="vendor/leaflet/leaflet.js"></script><script>
const appPath=location.pathname.startsWith('/redmine/')?'/redmine':'';
const apiFetch=(path,options)=>fetch(appPath+path,options);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,selected=null,markers=[], mode='map', redmineCustomers=[];const map=L.map('map').setView([49.8,15.5],7);const list=document.querySelector('#list'),detail=document.querySelector('#detail'),message=document.querySelector('#map-message');
function statusLabel(s){return s?({'open':'Otevřené úkoly','closed':'Všechny nalezené uzavřené','none':'Bez nalezených vazeb','unknown':'Stav není úplný'}[s.state]||'Neověřeno'):'Neověřeno'}
function showList(){document.querySelector('#map-list').setAttribute('aria-pressed',String(mode==='map'));document.querySelector('#compare').setAttribute('aria-pressed',String(mode==='redmine'));if(mode==='redmine'){showComparison();return}const q=document.querySelector('#search').value.toLocaleLowerCase('cs');const filtered=data.customers.filter(c=>(c.name+' '+c.address+' '+c.issue_id).toLocaleLowerCase('cs').includes(q));document.querySelector('#count').textContent=`${filtered.length} zákazníků · ${data.customers.filter(c=>c.location).length} se souřadnicemi`;list.innerHTML=filtered.map(c=>`<button class="customer ${selected===c.issue_id?'selected':''}" data-id="${c.issue_id}"><strong>${esc(c.name)}</strong><span>${esc(c.address||'Adresa chybí')}</span><span>#${c.issue_id}${c.location?(c.location_source==='Ručně potvrzeno'?' · potvrzeno':' · poloha k ověření'):' · bez souřadnic'} · ${esc(statusLabel(c.related_status))}</span></button>`).join('')||`<p>Žádný zákazník neodpovídá hledání.${q?` <a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(q)}">Vyhledat tento název na Googlu</a> (odešle hledaný text Googlu).`:''}</p>`}
function showComparison(){const q=document.querySelector('#search').value.toLocaleLowerCase('cs');const filtered=redmineCustomers.filter(c=>(c.name+' '+c.address+' '+c.id).toLocaleLowerCase('cs').includes(q));document.querySelector('#count').textContent=`${filtered.length} zákazníků z Redmine · ${redmineCustomers.filter(c=>!c.in_map).length} mimo mapový seznam`;list.innerHTML=filtered.map(c=>`<div class="customer"><strong>${esc(c.name)}</strong><span>#${c.id} · ${esc(c.status)} · ${c.in_map?'v mapovém seznamu':'mimo mapový seznam'}</span><span>${esc(c.address||'Adresa v Redmine chybí')}</span>${c.in_map?`<button type="button" data-open="${c.id}">Zobrazit</button>`:`<button type="button" data-add="${c.id}">Přidat do seznamu</button>`}</div>`).join('')||`<p>Žádný zákazník neodpovídá hledání.${q?` <a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(q)}">Vyhledat tento název na Googlu</a> (odešle hledaný text Googlu).`:''}</p>`}
async function compare(){document.querySelector('#count').textContent='Načítám zákazníky z Redmine…';try{const r=await apiFetch('/api/redmine-customers',{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);redmineCustomers=v.customers;mode='redmine';showList()}catch(e){document.querySelector('#count').textContent='Porovnání se nezdařilo: '+e.message}}
async function refreshScan(){try{let r=await apiFetch('/api/scan-status'),v=await r.json();document.querySelector('#count').textContent=`Kontrola úkolů: ${v.done}/${v.total}, chyby: ${v.errors}`;if(v.running){setTimeout(refreshScan,2000)}else{let r=await apiFetch('/api/customers');data=await r.json();draw();if(v.errors)document.querySelector('#count').textContent+=` · neověřeno kvůli chybě: ${v.errors}`}}catch(e){document.querySelector('#count').textContent='Kontrola se nezdařila: '+e.message}}
document.querySelector('#scan').addEventListener('click',async()=>{try{let r=await apiFetch('/api/scan-status',{method:'POST'});if(!r.ok)throw Error('server odmítl požadavek');refreshScan()}catch(e){document.querySelector('#count').textContent='Kontrola se nezdařila: '+e.message}});
document.querySelector('#back-to-list').addEventListener('click',()=>{document.querySelector('#detail-view').hidden=true;document.querySelector('#customer-list-view').hidden=false;showList();document.querySelector('#search').focus()});
document.querySelector('#compare').addEventListener('click',compare);document.querySelector('#map-list').addEventListener('click',()=>{mode='map';showList()});
list.addEventListener('click',async e=>{const add=e.target.closest('[data-add]'),open=e.target.closest('[data-open]');if(open){mode='map';select(Number(open.dataset.open));return}if(!add)return;add.disabled=true;try{const r=await apiFetch('/api/add-customer/'+add.dataset.add,{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);const refreshed=await apiFetch('/api/customers');data=await refreshed.json();redmineCustomers.find(c=>c.id===Number(add.dataset.add)).in_map=true;showList();draw()}catch(err){document.querySelector('#count').textContent='Přidání se nezdařilo: '+err.message;add.disabled=false}});
function select(id){const c=data.customers.find(x=>x.issue_id===id);if(!c)return;selected=id;showList();document.querySelector('#customer-list-view').hidden=true;document.querySelector('#detail-view').hidden=false;document.querySelector('#detail-view').scrollTop=0;detail.innerHTML=`<h2>${esc(c.name)}</h2><p>${esc(c.address||'Adresa chybí')} · <a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${c.issue_id}">Záznam v Redmine #${c.issue_id}</a></p><p>${esc(c.location_source||'Souřadnice nejsou k dispozici.')}</p><p>Identifikátor odpovídá záznamu v Redmine; údaje o provozovně ověř před výjezdem.${c.in_open_issues?' Záznam je v aktuálních otevřených úkolech.':''}</p><p id="current-status">Úkoly: ${esc(statusLabel(c.related_status))}${c.related_status?.checked_at?' · kontrola '+new Date(c.related_status.checked_at).toLocaleString('cs-CZ'):''}</p><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/search?q=${encodeURIComponent(c.name)}">Hledat název na Googlu</a><p>Odkaz při otevření odešle název zákazníka Googlu.</p><button type="button" id="redmine-data">Dohledat údaje v Redmine</button><div id="redmine-details" role="status"></div><button type="button" id="find-issues">Načíst související úkoly</button><div id="related" role="status"></div><form class="coords"><label>Zeměpisná šířka<input name="lat" required type="number" step="any" min="-90" max="90" value="${c.location?.[0]??''}"></label><label>Zeměpisná délka<input name="lon" required type="number" step="any" min="-180" max="180" value="${c.location?.[1]??''}"></label><button>Uložit polohu</button><span role="status" id="saved"></span></form>`;if(c.location)map.setView(c.location,14);if(matchMedia('(max-width: 750px)').matches)detail.scrollIntoView({block:'start',behavior:'auto'})}
function draw(){for(const m of markers)map.removeLayer(m);markers=[];for(const c of data.customers){if(!c.location)continue;const m=L.circleMarker(c.location,{radius:7,color:'#fff',weight:2,fillColor:c.related_status?.state==='open'?'#cf3545':c.related_status?.state==='closed'?'#16834d':'#8794a4',fillOpacity:1}).addTo(map);m.bindTooltip(esc(c.name));m.on('click',()=>select(c.issue_id));markers.push(m)}showList()}
detail.addEventListener('click',async e=>{if(e.target.id!=='redmine-data')return;const id=selected,target=document.querySelector('#redmine-details');e.target.disabled=true;target.textContent='Načítám údaje…';try{const r=await apiFetch('/api/customer-details/'+id,{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);if(id===selected)target.innerHTML=`<p>Redmine: ${esc(v.name)}<br>Adresa: ${esc(v.address||'neuvedena')}<br>GPS: ${esc(v.gps||'neuvedeno')}</p>`}catch(err){if(id===selected)target.textContent='Údaje se nepodařilo načíst: '+err.message}finally{e.target.disabled=false}});
detail.addEventListener('click',async e=>{if(e.target.id!=='find-issues')return;const id=selected, target=document.querySelector('#related');e.target.disabled=true;target.textContent='Hledám vazby v Redmine…';try{const r=await apiFetch('/api/customer-issues/'+id,{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);if(id!==selected)return;target.innerHTML=v.issues.length?v.issues.map(i=>`<p>${i.open?'Otevřený':'Uzavřený'} · <a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${i.id}">#${i.id} ${esc(i.subject)}</a> · ${esc(i.status)}</p>`).join(''):'<p>Žádná nalezená související vazba.</p>';if(v.inaccessible)target.insertAdjacentHTML('beforeend',`<p>Neověřeno z důvodu nedostupných úkolů: ${v.inaccessible}</p>`);const c=data.customers.find(x=>x.issue_id===id);c.related_status=v;draw()}catch(err){if(id===selected)target.textContent='Nepodařilo se ověřit vazby: '+err.message}finally{e.target.disabled=false}});
list.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)select(Number(b.dataset.id))});document.querySelector('#search').addEventListener('input',showList);detail.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,s=document.querySelector('#saved');s.textContent='Ukládám…';try{const r=await apiFetch('/api/location/'+selected,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat:f.lat.value,lon:f.lon.value})});const d=await r.json();if(!r.ok)throw Error(d.error);const c=data.customers.find(x=>x.issue_id===selected);c.location=[Number(f.lat.value),Number(f.lon.value)];draw();map.setView(c.location,14);s.textContent='Uloženo.'}catch(err){s.textContent='Nepodařilo se uložit: '+err.message}});
setInterval(async()=>{if(document.hidden)return;try{const r=await apiFetch('/api/customers');if(!r.ok)return;data=await r.json();draw();const c=data.customers.find(x=>x.issue_id===selected),status=document.querySelector('#current-status');if(c&&status)status.textContent='Úkoly: '+statusLabel(c.related_status)+(c.related_status?.checked_at?' · kontrola '+new Date(c.related_status.checked_at).toLocaleString('cs-CZ'):'')}catch(e){}},60000);
apiFetch('/api/customers').then(r=>r.json()).then(d=>{data=d;if(d.map_configured){L.tileLayer(appPath+'/maptiles/{z}/{x}/{y}',{maxZoom:19,attribution:'<a href="https://api.mapy.com/copyright" target="_blank" rel="noopener">© Seznam.cz a.s. a další</a>'}).addTo(map);document.querySelector('#logo').hidden=false}else{message.hidden=false;message.textContent='Mapový podklad čeká na nastavení API klíče Mapy.com.'}draw();const points=data.customers.filter(c=>c.location).map(c=>c.location);if(points.length)map.fitBounds(points,{padding:[25,25],maxZoom:13})}).catch(()=>{message.hidden=false;message.textContent='Seznam zákazníků se nepodařilo načíst.'});
</script></body></html>
