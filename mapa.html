<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mapa zákazníků · Redmine</title><link rel="stylesheet" href="/vendor/leaflet/leaflet.css"><style>
:root{font-family:system-ui,sans-serif;color:#e9edf4;background:#101722;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #344255;background:#182333}header div,main{max-width:1400px;margin:auto;padding:18px 24px}header div{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;margin:0}h2{font-size:19px}p{color:#b5c4d5;line-height:1.5}a{color:#90d4ff}button,input{font:inherit;border-radius:4px;padding:10px;border:1px solid #4f7598}button{background:#294966;color:#fff;cursor:pointer}button:hover{background:#365d80}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #82c9fc;outline-offset:2px}input{background:#182333;color:#fff;min-width:0}.layout{display:grid;grid-template-columns:minmax(270px,380px) minmax(0,1fr);gap:20px}.list{max-height:65vh;overflow:auto;border-top:1px solid #344255}.customer{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #344255;border-radius:0;background:transparent;padding:12px}.customer.selected{background:#263c51}.customer span{display:block;color:#b5c4d5;font-size:14px;margin-top:4px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{flex:1}.map-wrap{position:relative;background:#202f40}.map{height:480px;background:#202f40}.map-message{position:absolute;z-index:500;left:60px;top:12px;background:#182333;padding:10px;max-width:70%;color:#e9edf4}.map-logo{position:absolute;bottom:22px;left:12px;z-index:500;background:white;padding:3px}.map-logo img{height:30px;display:block}.detail{border-top:1px solid #344255;margin-top:16px}.detail h2{margin-bottom:4px}.detail p{margin:5px 0 12px}.coords{display:flex;gap:8px;flex-wrap:wrap}.coords label{display:flex;flex-direction:column;gap:4px;color:#b5c4d5;font-size:14px}.coords input{width:150px}.coords button{align-self:end}.leaflet-control-attribution{color:#182333}.count{font-variant-numeric:tabular-nums}@media(max-width:750px){header div,main{padding:16px}.layout{display:flex;flex-direction:column-reverse}.map{height:350px}.list{max-height:40vh}}
</style></head><body><header><div><h1>Mapa zákazníků</h1><a href="/">Zpět na přehled</a></div></header><main><div class="layout"><section><div class="tools"><input id="search" type="search" placeholder="Hledat zákazníka nebo adresu" aria-label="Hledat zákazníka nebo adresu"></div><p id="count" class="count" role="status">Načítám…</p><div class="list" id="list"></div></section><section><div class="map-wrap"><div id="map" class="map" aria-label="Mapa zákazníků"></div><div id="map-message" class="map-message" hidden></div><a class="map-logo" id="logo" href="https://mapy.com/" target="_blank" rel="noopener" hidden><img src="https://api.mapy.com/img/api/logo.svg" alt="Mapy.com"></a></div><div id="detail" class="detail"><p>Vyber zákazníka ze seznamu.</p></div></section></div></main><script src="/vendor/leaflet/leaflet.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,selected=null,markers=[];const map=L.map('map').setView([49.8,15.5],7);const list=document.querySelector('#list'),detail=document.querySelector('#detail'),message=document.querySelector('#map-message');
function showList(){const q=document.querySelector('#search').value.toLocaleLowerCase('cs');const filtered=data.customers.filter(c=>(c.name+' '+c.address+' '+c.issue_id).toLocaleLowerCase('cs').includes(q));document.querySelector('#count').textContent=`${filtered.length} zákazníků · ${data.customers.filter(c=>c.location).length} se souřadnicemi`;list.innerHTML=filtered.map(c=>`<button class="customer ${selected===c.issue_id?'selected':''}" data-id="${c.issue_id}"><strong>${esc(c.name)}</strong><span>${esc(c.address||'Adresa chybí')}</span><span>#${c.issue_id}${c.location?(c.location_source==='Ručně potvrzeno'?' · potvrzeno':' · poloha k ověření'):' · bez souřadnic'}</span></button>`).join('')||'<p>Žádný zákazník neodpovídá hledání.</p>'}
function select(id){const c=data.customers.find(x=>x.issue_id===id);if(!c)return;selected=id;showList();detail.innerHTML=`<h2>${esc(c.name)}</h2><p>${esc(c.address||'Adresa chybí')} · <a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${c.issue_id}">Záznam v Redmine #${c.issue_id}</a></p><p>${esc(c.location_source||'Souřadnice nejsou k dispozici.')}</p><p>Číslo pochází z tabulky; vazba na zákazníka zatím není ověřena.${c.in_open_issues?' Záznam je v aktuálních otevřených úkolech.':''}</p><button type="button" id="find-issues">Najít související otevřené úkoly</button><div id="related" role="status"></div><form class="coords"><label>Zeměpisná šířka<input name="lat" required type="number" step="any" min="-90" max="90" value="${c.location?.[0]??''}"></label><label>Zeměpisná délka<input name="lon" required type="number" step="any" min="-180" max="180" value="${c.location?.[1]??''}"></label><button>Uložit polohu</button><span role="status" id="saved"></span></form>`;if(c.location)map.setView(c.location,14)}
function draw(){for(const m of markers)map.removeLayer(m);markers=[];for(const c of data.customers){if(!c.location)continue;const m=L.circleMarker(c.location,{radius:7,color:'#fff',weight:2,fillColor:c.location_source==='Ručně potvrzeno'?'#2a769a':'#b77928',fillOpacity:1}).addTo(map);m.bindTooltip(esc(c.name));m.on('click',()=>select(c.issue_id));markers.push(m)}showList()}
detail.addEventListener('click',async e=>{if(e.target.id!=='find-issues')return;const id=selected, target=document.querySelector('#related');e.target.disabled=true;target.textContent='Hledám vazby v Redmine…';try{const r=await fetch('/api/customer-issues/'+id,{method:'POST'}),v=await r.json();if(!r.ok)throw Error(v.error);if(id!==selected)return;target.innerHTML=v.issues.length?v.issues.map(i=>`<p><a target="_blank" rel="noopener noreferrer" href="${esc(data.base_url)}/issues/${i.id}">#${i.id} ${esc(i.subject)}</a> · ${esc(i.status)}</p>`).join(''):'<p>Žádná přímá vazba v aktuálně synchronizovaných otevřených úkolech.</p>'}catch(err){if(id===selected)target.textContent='Nepodařilo se ověřit vazby: '+err.message}finally{e.target.disabled=false}});
list.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)select(Number(b.dataset.id))});document.querySelector('#search').addEventListener('input',showList);detail.addEventListener('submit',async e=>{e.preventDefault();let f=e.target,s=document.querySelector('#saved');s.textContent='Ukládám…';try{const r=await fetch('/api/location/'+selected,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lat:f.lat.value,lon:f.lon.value})});const d=await r.json();if(!r.ok)throw Error(d.error);const c=data.customers.find(x=>x.issue_id===selected);c.location=[Number(f.lat.value),Number(f.lon.value)];draw();map.setView(c.location,14);s.textContent='Uloženo.'}catch(err){s.textContent='Nepodařilo se uložit: '+err.message}});
fetch('/api/customers').then(r=>r.json()).then(d=>{data=d;if(d.map_configured){L.tileLayer('/maptiles/{z}/{x}/{y}',{maxZoom:19,attribution:'<a href="https://api.mapy.com/copyright" target="_blank" rel="noopener">© Seznam.cz a.s. a další</a>'}).addTo(map);document.querySelector('#logo').hidden=false}else{message.hidden=false;message.textContent='Mapový podklad čeká na nastavení API klíče Mapy.com.'}draw();const points=data.customers.filter(c=>c.location).map(c=>c.location);if(points.length)map.fitBounds(points,{padding:[25,25],maxZoom:13})}).catch(()=>{message.hidden=false;message.textContent='Seznam zákazníků se nepodařilo načíst.'});
</script></body></html>
