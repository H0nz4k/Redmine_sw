# Include inside the existing dashboard server block. Uses its existing
# $calendar_missing_access map: tunneled requests require the Access assertion.
location = /redmine { return 301 /redmine/; }
location ^~ /redmine/ {
    if ($calendar_missing_access) { return 403; }
    allow 127.0.0.1;
    allow ::1;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    deny all;
    access_log off;
    client_max_body_size 8k;
    proxy_pass http://unix:/etc/nginx/conf.d/redmine/redmine.sock:/;
    proxy_set_header Host $http_host;
    proxy_set_header Origin $http_origin;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
}
